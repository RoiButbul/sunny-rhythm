const KEY='sunny.v1', LEGACY_KEY='sunny-rhythm-v1';
const SYNC_URL='https://sunny-forge-sync.roi-butbul22.workers.dev/v2/sunny-6271f463d07a4d5181d61691214d11b4';
const SYNC_META='sunny.sync.v2';let syncMeta;try{syncMeta=JSON.parse(localStorage.getItem(SYNC_META)||'null')||{revision:null,pending:false}}catch(e){syncMeta={revision:null,pending:false}}let syncReady=false,syncBusy=false,syncTimer=null,syncState='Checking cloud backup…';
function setSyncState(v){syncState=v;if(tab==='settings')render()}
function meaningful(v){return !!(v&&v.version===1&&Array.isArray(v.events)&&(v.events.length||v.session||v.training?.length||Object.keys(v.checklist?.windowDays||{}).length||JSON.stringify(sanitizeCfg(v.cfg))!==JSON.stringify(DEFAULT)))}
function markPending(){syncMeta.pending=true;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));if(syncReady){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500)}}
async function syncNow(){
  if(syncBusy||!navigator.onLine)return;
  syncBusy=true;
  try{
    let res=await fetch(SYNC_URL,{cache:'no-store'});
    if(!res.ok)throw Error('Cloud unavailable');
    let remote=await res.json();
    if(remote.revision&&(!remote.data||remote.data.version!==1||!Array.isArray(remote.data.events)||!remote.data.cfg))throw Error('Invalid cloud copy');
    // An untouched plan generated by render is not existing device data.
    let hasLocal=syncReady||syncMeta.pending?meaningful(db):initialHasLocal;
    if(!syncReady){
      syncReady=true;
      if(!hasLocal&&!syncMeta.pending&&!syncMeta.revision&&remote.revision){
        db=normalizeData(remote.data);
        localStorage.setItem(KEY,JSON.stringify(db));syncMeta={revision:remote.revision,pending:false};localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));
        setSyncState('Restored from cloud.');render();return;
      }
      if(hasLocal&&!remote.revision&&!syncMeta.revision){syncMeta.pending=true;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta))}
      if(!hasLocal&&!remote.revision){syncMeta.pending=false;syncMeta.revision=null;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta))}
    }
    if(remote.revision!==syncMeta.revision){
      if(syncMeta.pending||hasLocal&&syncMeta.revision===null){setSyncState('Cloud changed elsewhere. Your device stays unchanged. Export its backup before merging.');return}
      if(remote.revision){
        db=normalizeData(remote.data);
        localStorage.setItem(KEY,JSON.stringify(db));syncMeta={revision:remote.revision,pending:false};localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));
        setSyncState('Updated from cloud.');render();return;
      }
      setSyncState('Cloud copy changed. Your device stays unchanged. Export a backup.');return;
    }
    if(!syncMeta.pending){setSyncState(hasLocal?'Cloud backup up to date.':'No data to back up yet.');return}
    // A deletion is a real change: sync an empty snapshot so the old cloud day cannot come back.
    let snapshot=JSON.stringify(db),payload={baseRevision:syncMeta.revision,data:JSON.parse(snapshot)};
    let put=await fetch(SYNC_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(put.status===409){setSyncState('Cloud changed elsewhere. Your device stays unchanged. Export a backup before merging.');return}
    if(!put.ok)throw Error('Cloud backup failed');
    let saved=await put.json();syncMeta={revision:saved.revision,pending:JSON.stringify(db)!==snapshot};localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));
    setSyncState(syncMeta.pending?'Uploading latest changes…':'Cloud backup up to date.');if(syncMeta.pending)setTimeout(syncNow,1500);
  }catch(e){setSyncState('Saved on this device; cloud backup will retry when connected.')}
  finally{syncBusy=false}
}
window.addEventListener('online',()=>syncNow());window.addEventListener('focus',()=>syncNow());
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},60000);


const DEFAULT={wake:'07:00',bed:'23:00',meals:3,night:true,potty:10,meal:15,play:10,cooldown:20,nap:75,wakeMin:45,wakeMax:90,food:'Monge'};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const time=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const date=t=>new Date(t).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const clock=t=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
const duration=ms=>{let s=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
const mins=ms=>`${Math.max(0,Math.round(ms/60000))} min`;
function sanitizeCfg(v){let s={...DEFAULT};if(!v||typeof v!=='object')return s;for(const k of ['wake','bed'])if(/^([01]\d|2[0-3]):[0-5]\d$/.test(v[k]))s[k]=v[k];for(const k of ['potty','meal','play','cooldown','nap','wakeMin','wakeMax'])if(Number.isFinite(+v[k]))s[k]=Math.max(1,Math.min(240,Math.round(+v[k])));s.meals=3;s.night=v.night!==false;s.food='Monge';if(s.wakeMax<s.wakeMin)s.wakeMax=s.wakeMin;return s}
function normalizeData(v){return {version:1,cfg:sanitizeCfg(v.cfg),events:v.events.filter(x=>x&&typeof x.type==='string'&&Number.isFinite(x.at)&&x.at>0).slice(-30000).map(e=>({...e,id:e.id||uid()})),training:Array.isArray(v.training)?v.training.filter(x=>x&&(typeof x.card==='string'||typeof x.exercise==='string')&&Number.isFinite(x.at)).slice(-10000):[],session:validSession(v.session)?v.session:null,trainingPlan:v.trainingPlan&&typeof v.trainingPlan==='object'?v.trainingPlan:{tier:8,choice:'name'},trainingSession:v.trainingSession&&typeof v.trainingSession==='object'&&Number.isFinite(v.trainingSession.started)?v.trainingSession:null,checklist:v.checklist&&typeof v.checklist==='object'?v.checklist:{}}}
function validSession(s){return s&&typeof s==='object'&&Number.isFinite(s.started)&&Number.isFinite(s.cycle)&&Number.isFinite(s.step)&&s.step>=0&&s.step<20&&s.cycle>=0&&s.cycle<6&&['cycle','wind','bed'].includes(s.mode)}
function load(){try{if(!localStorage.getItem(KEY)&&localStorage.getItem(LEGACY_KEY))localStorage.setItem(KEY,localStorage.getItem(LEGACY_KEY));let v=JSON.parse(localStorage.getItem(KEY));if(v?.version===1&&Array.isArray(v.events)&&v.events.length<50000)return normalizeData(v)}catch(e){}return {version:1,cfg:{...DEFAULT},events:[],training:[],session:null,trainingPlan:{tier:8,choice:'name'},trainingSession:null,checklist:{}}}
let db=load(),tab='now',notice='',tick=Date.now();
const initialHasLocal=meaningful(db);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));markPending();return true}catch(e){notice='Could not save on this device. Export a backup before continuing.';return false}}
function events(){return db.events.slice().sort((a,b)=>a.at-b.at||String(a.id).localeCompare(String(b.id)))}
function log(type,meta={}){let at=Date.now(),ev={id:uid(),type,at,day:localDate(new Date(at)),cycle:db.session?.cycle??null,step:db.session?.step??null,...meta};db.events.push(ev);persist();return ev}
function mealsAt(){return [0,2,3,4]}
function cycleKind(n){return ['Morning','Play','Midday','Training','Evening','Bedtime'][n]||'Bedtime'}
function mealName(c){return ({0:'Breakfast',2:'Lunch',3:'Afternoon meal',4:'Dinner'})[c]||'Meal'}
function sequence(c,planVersion=db.session?.planVersion||2){if(c===5)return [{name:'Wake up',kind:'wake',duration:0,detail:'One last gentle wake window.'},{name:'Quiet play',kind:'play',duration:db.cfg.play,detail:'Keep the last play gentle.'},{name:'Potty',kind:'potty',duration:db.cfg.potty,detail:'One last potty trip.'},{name:'Bedtime',kind:'bed',duration:0,detail:'Settle Sunny in for the night.'}];let seq=[{name:'Wake up',kind:'wake',duration:0,detail:'Sunny is up. Potty comes first.'},{name:'Potty',kind:'potty',duration:db.cfg.potty,detail:'Offer her a safe potty spot.'}];let meal=mealsAt().includes(c),activity=c===3?'training':'play';if(planVersion>=2&&meal)seq.push({name:'Train before food',kind:'training',duration:db.cfg.play,detail:'A short, gentle session while Sunny is interested. Use a little kibble from this meal as rewards, then serve the rest.'});if(meal)seq.push({name:mealName(c),kind:'meal',duration:db.cfg.meal,detail:planVersion>=2?'Serve the rest of this meal after training. Any kibble used as rewards is part of her meal portion.':'A gentle meal. Note how much she eats.'});seq.push({name:c===0?(planVersion>=2?'Play':'Play / train'):c===3?'Train through play':'Play',kind:activity,duration:db.cfg.play,detail:c===3?'One short, happy indoor exercise. Use part of her meal as rewards; stop while she is succeeding.':'A short, puppy-paced activity.'},{name:'Potty',kind:'potty',duration:db.cfg.potty,detail:'Offer potty again after activity.'});if(c<2)seq.push({name:'Cool down',kind:'cooldown',duration:0,detail:'Let her settle for as long as she needs. Already sleepy? Go straight to Nap or skip this.'});seq.push({name:'Nap',kind:'nap',duration:db.cfg.nap,detail:'Let her rest; tap when she wakes.'});return seq}
function phase(s=db.session){if(!validSession(s)||s.finished)return null;if(s.mode==='wind')return {name:'Wind down',kind:'wind',duration:db.cfg.cooldown,detail:'Keep things gentle before bed.'};if(s.mode==='bed')return {name:'Bedtime',kind:'bed',duration:0,detail:'Settle Sunny in.'};return sequence(s.cycle,s.planVersion||1)[s.step]||null}
function todayList(){return events().filter(e=>localDate(new Date(e.at))===localDate())}

function sourceWindows(){let specs=[['Wake up','Potty','Breakfast','Play / Training','Potty','Cool down','Nap'],['Wake up','Potty','Play','Potty','Cool down','Nap'],['Wake up','Potty','Lunch','Play','Potty','Nap'],['Wake up','Potty','Enrichment','Potty','Nap'],['Wake up','Potty','Dinner','Training','Potty','Nap'],['Wake up','Play','Potty','Bedtime']];return specs.map((names,c)=>({id:uid(),cards:names.map((name,step)=>({id:uid(),name,kind:name==='Wake up'?'wake':name==='Potty'?'potty':['Breakfast','Lunch','Dinner'].includes(name)?'meal':name==='Cool down'?'cooldown':name==='Nap'?'nap':name==='Bedtime'?'bed':name==='Training'?'training':name==='Enrichment'?'enrichment':'play',cycle:c,step}))}))}

function windowState(w){let wake=w.cards.find(x=>x.kind==='wake'),end=w.cards.find(x=>['nap','bed'].includes(x.kind));return end&&windowEvent(end)?.type!=='skip'&&windowEvent(end)?'closed':wake&&windowEvent(wake)?.type!=='skip'&&windowEvent(wake)?'open':'ready'}

function windowGuideline(x,n){let clock={Breakfast:'08:00',Lunch:'14:00',Dinner:'20:00'};if(x.kind==='meal')return `${clock[x.name]||''} guide · around 15 min`;if(x.kind==='wake')return 'Wake window guide · 45–90 min';if(x.kind==='potty')return 'Guide · around 10 min';if(['play','training','enrichment'].includes(x.kind))return 'Guide · around 10 min';if(x.kind==='cooldown')return 'Guide · around 20 min · no cap';return `Closes window ${n} · at her pace`}
function renderWindows(){let d=windowDay(),ws=d.windows,w=ws.find(x=>x.id===d.selected)||ws[0],n=ws.indexOf(w)+1,st=windowState(w);return `<section class="hero"><img class="sun" src="icon.svg?v=2" alt="A hand-drawn sun"><div class="eyebrow">Sunny's day · ${safe(date(tick))}</div><h1>A little day,<br>together.</h1><p>Choose a window. Follow Sunny.</p></section><section class="card"><div class="row"><strong class="soft">Windows in the day</strong><div class="window-count"><button class="secondary" data-window-count="-1" aria-label="Remove an empty middle window">−</button><b>${ws.length}</b><button class="secondary" data-window-count="1" aria-label="Add an empty middle window">+</button></div></div><div class="windows">${ws.map((z,i)=>`<button class="secondary window ${z.id===w.id?'selected':''}" data-window-select="${z.id}"><b>${i+1}</b>${i===0?'<small>Good morning</small>':i===ws.length-1?'<small>Good night</small>':''}${windowState(z)==='closed'?'<small>✓</small>':''}</button>`).join('')}</div><p class="tiny">Count changes add or remove empty middle windows only.</p></section><section class="check-intro"><div><div class="eyebrow">WINDOW ${n}</div><h2>${n===1?'Good morning.':n===ws.length?'Good night.':'One moment at a time.'}</h2></div>${st==='closed'?'<span class="chip good">Closed</span>':''}</section>${w.cards.length?w.cards.map(x=>{let e=windowEvent(x),terminal=['nap','bed'].includes(x.kind);return `<section class="check-item window-item ${e?'complete':''} ${terminal&&!e?'current':''}" data-window-row="${x.id}"><div class="check-head"><span class="check-mark">${e?e.type==='skip'?'–':'✓':terminal?'☾':x.kind==='wake'?'☀':'○'}</span><div><strong>${safe(x.name)}</strong><small>${safe(windowGuideline(x,n))}</small></div>${!e&&st!=='closed'?`<button class="grip" data-window-grip="${x.id}" aria-label="Move ${safe(x.name)}" title="Hold to drag; arrow keys move">⠿</button>`:''}</div>${e?`<p class="check-result">${safe(windowHistory(x))}</p><button class="check-edit" dat function changeWindowCount(delta){let d=windowDay();if(delta>0){if(d.windows.length>=20){notice='Up to 20 windows in this first version.';render();return}d.windows.splice(d.windows.length-1,0,{id:uid(),cards:[]})}else{let i=d.windows.findLastIndex((w,i)=>i>0&&i<d.windows.length-1&&w.cards.length===0);if(i<0){notice='Only an empty middle window can be removed. Existing activities stay.';render();return}let removed=d.windows.splice(i,1)[0];if(d.selected===removed.id)d.selected=d.windows[0].id}persist();render()}
function logWindowCard(id,outcome){let d=windowDay(),w=d.windows.find(w=>w.cards.some(x=>x.id===id)),x=w?.cards.find(x=>x.id===id);if(!x||windowEvent(x)||windowState(w)==='closed')return;let before=JSON.parse(JSON.stringify(db.events)),at=Date.now(),common={at,day:localDate(),windowDay:localDate(),windowId:w.id,windowCard:x.id,cycle:x.cycle,step:x.step,label:x.name};let ev={...common,id:uid(),type:outcome==='skip'?'skip':x.kind==='potty'&&outcome==='no-result'?'potty-no':x.kind==='bed'?'bed':x.kind,outcome};db.events.push(ev);if(outcome!=='skip'&&['wake','nap','bed'].includes(x.kind)){db.events.push({...common,id:uid(),type:x.kind==='wake'?'sleep-end':'sleep-start',label:x.kind==='wake'?'Woke up':'Asleep',windowCard:null,windowPair:ev.id})}windowUndo={type:'log',ids:db.events.slice(before.length).map(x=>x.id),label:`${x.name} recorded.`};persist();render()}

function checklistShift(id,cycle){if(db.checklist?.day!==localDate())return 0;let shifts=db.checklist.shifts||{};if(Object.hasOwn(shifts,id)&&Number.isFinite(Number(shifts[id])))return Number(shifts[id]);if(id===`${cycle}.cooldown`){let oldNap=sequence(cycle,2).findIndex(x=>x.kind==='nap');return Number(shifts[`${cycle}.${oldNap}`])||0}return 0}
function checklistItems(){let arr=[],start=new Date(`${localDate()}T${db.cfg.wake}`).getTime(),end=new Date(`${localDate()}T${db.cfg.bed}`).getTime();if(end<=start)end=start+16*3600000;for(let c=0;c<6;c++){let seq=sequence(c,2),total=seq.reduce((n,x)=>n+Math.max(5,x.duration),0),offset=0;for(let step=0;step<seq.length;step++){let x=seq[step];if(c===3&&(x.kind==='meal'||x.name==='Train before food')){offset+=Math.max(5,x.duration);continue}let id=`${c}.${step}`,shift=checklistShift(id,c),at=start+(end-start)*(c+(offset/total))/6+shift;if(x.kind==='nap'&&c>=2){let coolId=`${c}.cooldown`;arr.push({name:'Cool down',kind:'cooldown',duration:0,detail:'Let her settle for as long as she needs. Already sleepy? Go straight to Nap or skip this.',id:coolId,cycle:c,step:null,at:at-5*60000+checklistShift(coolId,c)-shift})}arr.push({...x,id,cycle:c,step,at});offset+=Math.max(5,x.duration)}}return arr}
function itemEvents(x){return todayList().filter(e=>e.checkId===x.id&&e.type!=='skip'||(!e.checkId&&e.cycle===x.cycle&&e.step===x.step&&e.type!=='skip'&&e.type!=='day-start'&&e.type!=='sleep-start'&&e.type!=='sleep-end'&&e.type!=='day-end'&&(e.type===x.kind||x.kind==='potty'&&['potty','potty-no','potty-success'].includes(e.type)||x.kind==='meal'&&e.type==='meal'||x.kind==='training'&&e.type==='enrichment')))}

function suggestion(){let byDay={};for(const e of events()){if(!e.checkId||!['meal','play','cooldown','nap','potty'].includes(e.type))continue;let d=localDate(new Date(e.at));if(d===localDate())continue;(byDay[e.checkId]??=[]).push({day:d,at:e.at})}for(const x of checklistItems()){let samples=byDay[x.id]||[],days=new Set(samples.map(z=>z.day));if(days.size<3)continue;let diffs=samples.map(z=>{let d=new Date(z.at),actual=d.getHours()*60+d.getMinutes(),planned=new Date(`${localDate()}T${db.cfg.wake}`).getHours()*60+new Date(`${localDate()}T${db.cfg.wake}`).getMinutes()+(x.at-new Date(`${localDate()}T${db.cfg.wake}`).getTime())/60000;return actual-planned}).filter(n=>Math.abs(n)<240);if(diffs.length<3)continue;let avg=Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length);if(Math.abs(avg)>=20&&diffs.filter(n=>Math.sign(n)===Math.sign(avg)).length>=3)return `Across ${days.size} logged days, ${x.name.toLowerCase()} has happened about ${Math.abs(avg)} min ${avg>0?'later':'earlier'} than its guide. Consider shifting that estimate; keep following Sunny's cues.`}return ''}
function renderLegacyNow(){let items=checklistItems(),states=items.map(itemStatus),done=states.filter(x=>x.type==='done').length,open=states.findIndex(x=>x.type==='open'),focus=db.checklist?.day===localDate()?db.checklist.focusId:null,focused=items.findIndex(x=>x.id===focus),active=focused>=0?focused:open,insight=prediction(),tip='',meals=items.filter((x,i)=>x.kind==='meal'&&states[i].type==='done').length;return `<section class="hero"><img class="sun" src="icon.svg?v=2" alt="A hand-drawn sun"><div class="eyebrow">Sunny's day · ${safe(date(tick))}</div><h1>A little day,<br>together.</h1><p>A gentle plan, not a clock to race. Log what happens; open times move with her.</p><div class="progressbar"><i style="width:${Math.round(done/items.length*100)}%"></i></div><p class="soft">${done} of ${items.length} moments recorded · ${meals}/3 meals</p></section><section class="check-intro"><div><div class="eyebrow">TODAY'S RHYTHM</div><h2>One moment at a time.</h2></div><span class="soft">Times shift as you log</span></section>${items.map((x,i)=>{let st=states[i],isActive=i===active,ev=st.event;return `<section class="check-item ${isActive?'current':''} ${st.type==='done'?'complete':''}" id="item-${x.id}"><div class="check-time">${safe(time(x.at))}<small>guide</small></div><div class="check-main"><div class="check-head"><span class="check-mark">${st.type==='done'?'✓':st.type==='skip'?'–':i===active?'☀':'○'}</span><div><strong>${safe(x.name)}</strong><small>${safe(cycleKind(x.cycle))} · ${x.kind==='cooldown'?'as long as she needs':'at her pace'}</small></div></div>${st.type==='done'?`<p class="check-result">${safe(ev.outcome==='no-result'?'No result':ev.outcome==='success'?'Went potty':ev.outcome==='eaten'?'Ate':ev.label||'Done')} · ${safe(time(ev.at))}${ev.note?` · ${safe(ev.note)}`:''}</p><button class="textbtn check-edit" data-edit="${safe(ev.id)}">Edit entry</button>`:st.type==='skip'?`<p class="check-result">Skipped for now</p><button class="textbtn" data-act="reopen-item" data-item="${x.id}">Reopen</button>`:`<p class="check-detail">${safe(x.detail)}</p><div class="check-actions">${x.kind==='training'?`<button class="action" data-train-start="${x.id}">Start session →</button>`:x.kind==='potty'?`<button class="action" data-item="${x.id}" data-outcome="success">Went ✓</button><button class="secondary" data-item="${x.id}" data-outcome="no-result">No result</button>`:x.kind==='meal'?`<button class="action" data-item="${x.id}" data-outcome="eaten">Ate ✓</button>`:`<button class="action" data-item="${x.id}" data-outcome="done">Done ✓</button>`}<button class="iconbtn" data-act="skip-item" data-item="${x.id}">Skip</button></div><details class="check-detail-extra"><summary>Actual time / note</summary><label>When<input type="datetime-local" data-time="${x.id}"></label><label>What happened?<input type="text" maxlength="180" placeholder="Optional note" data-note="${x.id}"></label><p class="soft">Set these before tapping an outcome above. No popup needed.</p></details>`}</div></section>`}).join('')}<div class="check-footer"><button class="secondary" data-act="earlier-item">← Previous item</button><button class="secondary" data-act="next-item">Next item →</button></div>${insight?`<div class="notice">${safe(insight)}</div>`:''}<section class="card"><h2>Little extras</h2><div class="quick"><button class="secondary" data-act="quick-potty">+ Potty ✓</button><button class="secondary" data-act="quick-potty-no">+ No result</button><button class="secondary" data-act="accident">+ Accident</button><button class="secondary" data-act="stress">+ Stress sign</button><button class="secondary" data-act="crate-in">+ Crate in</button><button class="secondary" data-act="crate-out">+ Crate out</button>${db.cfg.night?'<button class="secondary" data-act="night-potty">+ Night potty</button>':''}</div><div class="row"><button class="iconbtn" data-act="door-open">Door open</button><button class="iconbtn" data-act="door-closed">Door closed</button><button class="iconbtn" d function renderTraining(){let chosen=currentExercise(),tier=trainingTier(),available=trainingChoices();return `<div class="eyebrow">Little sessions, lasting skills</div><h1>Train with Sunny.</h1><p class="hint">One exercise at a time, 3-5 easy repetitions over a few minutes. End while she is succeeding. This plan is a guide for an approximately 8-week-old puppy, not a diagnosis or a rigid age gate.</p><section class="focus training-focus"><div class="eyebrow">NEXT SESSION</div><h2>${safe(chosen.title)}</h2><p class="hint">${safe(chosen.goal)}</p><div class="row"><span class="tag">3-5 repetitions</span><span class="soft">Reward with part of her meal</span></div><button class="action full" data-train-start="">${db.trainingSession?'Resume session':'Start a session'} →</button><p class="soft">Training in today's schedule opens the same session. Each session is saved in History after you finish it.</p></section><section class="card"><h2>Choose one exercise</h2><p class="soft">Change the practice here; do not rush ahead because of a date.</p><div class="training-options">${available.map(x=>{let st=trainingStats(x.id);return `<button class="training-option ${chosen.id===x.id?'chosen':''}" data-train-pick="${safe(x.id)}"><strong>${safe(x.title)}</strong><small>${st.count?`${st.count} sessions · ${st.ready?'ready to try the next exercise':'practice at her pace'}`:'not started'} · ${x.age===8?'start here':x.age===10?'around 10-12 weeks':'around 3-4 months'}</small></button>`}).join('')}</div>${trainingStats(chosen.id).ready?`<button class="secondary full" data-train-next>Try the next exercise →</button>`:''}</section><section class="card"><h2>Age guide</h2><p class="soft">Sunny's birthday has not been entered. Choose a group when she reaches it, and check comfort before moving ahead.</p><div class="training-tier">${[[8,'Now · ~8-10 weeks'],[10,'Next · 10-12 weeks'],[16,'Later · 3-4 months']].map(([age,label])=>`<button class="${tier===age?'action':'secondary'}" data-train-tie let retro={date:'',time:'08:00',msg:'',last:[]};
const retroKinds={wake:'Woke up',sleep:'Fell asleep',pottyOk:'Potty outside',pottyNo:'Potty · no result',accident:'Accident',meal:'Meal',play:'Play',cooldown:'Cool down'};
function retroDate(){if(!retro.date||retro.date>localDate()){let d=new Date();d.setDate(d.getDate()-1);retro.date=localDate(d)}return retro.date}
function retroPanel(){let d=retroDate();return `<section class="card retro"><h2>Add to a past day</h2><p class="soft">Pick the day and time, then tap what happened. It is saved to that day right away.</p><div class="retro-when"><label>Day<input id="retro-date" type="date" max="${localDate()}" value="${safe(d)}"></label><label>Time<input id="retro-time" type="time" value="${safe(retro.time)}"></label></div><div class="retro-chips">${Object.entries(retroKinds).map(([k,t])=>`<button class="secondary" data-act="retro-add" data-item="${k}">${safe(t)}</button>`).join('')}</div>${retro.msg?`<p class="soft" role="status">${safe(retro.msg)}${retro.last.length?` <button class="textbtn" data-act="retro-undo">Undo</button>`:''}</p>`:''}</section>`}
function retroAdd(kind){let d=retroDate(),t=retro.time||'08:00',at=new Date(`${d}T${t}`).getTime();if(!Number.isFinite(at)||at>Date.now()){retro.msg='Choose a day and time that has already happened.';retro.last=[];render();return}let day=localDate(new Date(at)),base={at,day,retro:true},evs=[];let mk=(type,x={})=>({id:uid(),type,...base,...x});if(kind==='wake'){let a=mk('wake',{label:'Wake up'});evs=[a,mk('sleep-end',{label:'Woke up',windowPair:a.id})]}else if(kind==='sleep'){let a=mk('nap',{label:'Nap'});evs=[a,mk('sleep-start',{label:'Asleep',windowPair:a.id})]}else if(kind==='pottyOk')evs=[mk('potty',{outcome:'success'})];else if(kind==='pottyNo')evs=[mk('potty-no',{outcome:'no-result'})];else if(kind==='accident')evs=[mk('accident',{outcome:'accident'})];else if(kind==='meal')evs=[mk('meal',{label:'Meal',outcome:'eaten'})];else if(kind==='play')evs=[mk('play')];else if(kind==='cooldown')evs=[mk('cooldown')];else return;db.events.push(...evs);persist();retro.last=evs.map(x=>x.id);retro.msg=`Added ${retroKinds[kind]} to ${date(new Date(day+'T12:00'))} at ${t}.`;render()}
function renderHistory(){let groups={},sl=sleepByDay();for(const e of events())(groups[localDate(new Date(e.at))]??=[]).push(e);return `<div class="eyebrow">Little moments add up</div><h1>History.</h1><p class="hint">Sunny's days, stored here and backed up when online. A sleep day runs from the first wake-up of one day to the first wake-up of the next, so each night stays whole.</p>${retroPanel()}${Object.keys(groups).sort().reverse().map(d=>`<section class="card"><h2>${safe(date(new Date(d+'T12:00')))}</h2>${sl.days[d]?`<p class="sleep-pill">Slept ${sleepText(sl.days[d])}${d===sl.openKey?' so far':''}</p>`:''}<button class="textbtn" style="margin:-6px 0 8px" data-act="retro-here" data-item="${safe(d)}">Add to this day</button>${groups[d].slice().reverse().map(entry).join('')}</section>`).join('')||'<div class="empty">Her first logged moment will appear here.</div>'}`}
function field(k,label,type='number'){return `<div class="field"><label for="${k}">${label}</label><input id="${k}" name="${k}" type="${type}" ${type==='number'?`min="1" max="240"`:''} value="${safe(db.cfg[k])}"></div>`}
function renderSettings(){return `<div class="eyebrow">Make it hers</div><h1>Settings.</h1><p class="hint">Numbered windows follow the recorded day. There are no timers.</p><form id="cfg"><section class="card"><h2>Her day</h2><div class="field"><label><input name="night" type="checkbox" ${db.cfg.night?'checked':''}> Show night potty log</label></div></section><button class="action full" type="submit">Save</button></form><section class="card"><h2>Backup</h2><div class="notice">Data stays on this device and syncs to Cloudflare online. There is no account sign-in: anyone with the backup room link can read or replace its cloud copy. Keep a JSON export before switching devices.</div><p class="soft" role="status">${safe(syncState)}</p><button class="secondary full" data-act="sync">Sync now</button><button class="secondary full" data-act="export" style="margin-top:8px">Export JSON backup</button><label class="secondary full" style="display:block;text-align:center;margin-top:8px">Import JSON backup<input type="file" id="import" accept="application/json,.json" style="display:none"></label><p class="soft">Import replaces Sunny's local history, not FORGE.</p></section><p class="foot">Guides are not alarms or veterinary advice. No predictions until enough real entries exist.</p>`}
function openForm(title,body,save){let d=document.getElementById('editor');d.innerHTML=`<form method="dialog"><h2>${safe(title)}</h2>${body}<div class="row"><button class="secondary" value="cancel">Cancel</button><button class="action" value="save">Save</button></div></form>`;d.showModal();d.addEventListener('close',()=>{if(d.returnValue==='save')save(new FormData(d.querySelector('form')))}, {once:true})}
const input=(label,name,value='',type='text')=>`<div class="field"><label>${safe(label)}<input name="${safe(name)}" type="${type}" value="${safe(value)}"></label></div>`;
const select=(label,name,opts)=>`<div class="field"><label>${safe(label)}<select name="${safe(name)}">${opts.map(([v,t])=>`<option value="${safe(v)}">${safe(t)}</option>`).join('')}</select></label></div>`;
function optional(type){if(type==='crate-in'||type==='door')return select('Door state (optional)','door',[['','Not recorded'],['open','Open'],['closed','Closed']]);if(type==='potty'||type==='potty-no'||type==='potty-success'||type==='accident')return select('Outcome','outcome',[['success','Success'],['no-result','No result'],['accident','Accident']])+input('Location (optional)','location');if(type==='meal')return input('Amount in grams (optional)','amount','','number');return ''}
function record(type,advance=false){let meta={};if(type==='potty-success'||type==='potty')meta.outcome='success';if(type==='potty-no')meta.outcome='no-result';if(type==='accident')meta.outcome='accident';if(type==='meal')meta.outcome='eaten';if(type==='door-open'||type==='door-closed'){meta.door=type==='door-open'?'open':'closed';type='door'}if(type==='crate-in'&&events().slice().reverse().find(e=>e.type==='crate-in'||e.type==='crate-out')?.type==='crate-in'){notice='Already marked in the crate. Edit the log if needed.';render();return}if(type==='crate-out'&&events().slice().reverse().find(e=>e.type==='crate-in'||e.type==='crate-out')?.type!=='crate-in'){notice='Sunny is not marked in the crate. Edit the log if needed.';render();return}log(type,meta);if(advance)advanceStep(false,true);else render()}
function edit(id){let e=db.events.find(x=>x.id===id);if(!e)return;let dt=new Date(e.at),local=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);openForm(`Edit · ${names[e.type]||e.type}`,input('When did it happen?','at',local,'datetime-local')+optional(e.type)+input('Note (optional)','note',e.note||'')+`<button type="button" class="danger full" id="remove-event" style="margin-top:10px">Cancel this event</button>`,f=>{let at=new Date(f.get('at')).getTime();if(!Number.isFinite(at)||at>Date.now()+60000){notice='Choose a valid time, not in the future.';render();return}e.at=at;e.day=localDate(new Date(at));for(const pair of db.events.filter(z=>z.windowPair===e.id)){pair.at=at;pair.day=e.day}for(const [k,v] of f.entries())if(k!=='at')e[k]=v;persist();render()});document.getElementById('remove-event').onclick=()=>{if(confirm('Cancel this event?')){db.events=db.events.filter(x=>x.id!==id&&x.windowPair!==id);if(e.trainingId)db.training=db.training.filter(x=>x.id!==e.trainingId);persist();document.getElementById('editor').close('cancel');render()}};let form=document.getElementById('editor').querySelector('form');for(let k of ['door','outcome','location','amount','duration'])if(e[k]&&form.elements[k])form.elements[k].value=e[k]}
function stepSnapshot(s){return {cycle:s.cycle,step:s.step,mode:s.mode,planVersion:s.planVersion||1,wakeStart:s.wakeStart,started:s.started,finished:s.finished}}
function previousStep(){let s=db.session;if(!s||s.finished)return;let prior=(s.history||[]).pop();if(!prior){if(s.mode==='bed'){prior={...stepSnapshot(s),mode:'wind',started:Date.now()}}else if(s.mode==='wind'){prior={...stepSnapshot(s),mode:'cycle',step:sequence(s.cycle,s.planVersion||1).length-1,started:Date.now()}}else if(s.step>0){prior={...stepSnapshot(s),step:s.step-1,started:Date.now()}}else if(s.cycle>0){let prev=s.cycle-1,version=s.planVersion||1;prior={...stepSnapshot(s),cycle:prev,step:sequence(prev,version).length-1,started:Date.now()}}else{notice='Already at the first step.';render();return}}s.redo=(s.redo||[]).concat(stepSnapshot(s)).slice(-80);Object.assign(s,prior,{started:Date.now()});persist();notice='Showing the previous step. Your log is unchanged.';render()}
function advanceStep(skip=false,alreadyLogged=false){let s=db.session,p=phase();if(!p)return;let at=Date.now();if(s.redo?.length){let prior=stepSnapshot(s),next=s.redo.pop();s.history=(s.history||[]).concat(prior).slice(-80);Object.assign(s,next,{started:at});persist();render();return} let elapsed=Math.max(0,Math.round((at-s.started)/60000));s.history=(s.history||[]).concat(stepSnapshot(s)).slice(-80);s.redo=[];if(p.kind==='bed'){log('bed');log('day-end');s.finished=true;persist();render();return}if(p.kind==='wind'){log('wind',{duration:elapsed});s.mode='bed';s.started=at;persist();render();return}if(skip)log('skip',{note:p.name});else if(!alreadyLogged){if(p.kind==='nap'){log('nap',{duration:elapsed});log('sleep-end')}else if(p.kind==='meal')log('meal',{label:p.name,duration:elapsed});else if(p.kind==='wake')log('wake');else if(p.kind!=='potty')log(p.kind,{duration:elapsed})}if(p.kind==='nap'){if(skip)log('sleep-end');s.cycle=Math.min(5,s.cycle+1);s.planVersion=2;s.step=0;s.wakeStart=at}else{s.step++;if(p.kind==='wake')s.wakeStart=at} s.started=at;if(phase()?.kind==='nap')log('sleep-start');persist();render()}
function handleAction(a,itemId){notice='';let s=db.session;if(a==='retro-add'){retroAdd(itemId);return}if(a==='retro-undo'){let ids=new Set(retro.last);db.events=db.events.filter(e=>!ids.has(e.id));persist();retro.last=[];retro.msg='Removed.';render();return}if(a==='retro-here'){retro.date=itemId;retro.msg='';render();scrollTo({top:0,behavior:'smooth'});return}if(a==='sync'){syncNow();return}if(a==='earlier-item'){moveChecklist(-1);return}if(a==='next-item'){moveChecklist(1);return}if(a==='skip-item'){let x=checklistItems().find(x=>x.id===itemId);if(x&&itemStatus(x).type==='open'){db.events.push({id:uid(),type:'skip',at:Date.now(),day:localDate(),cycle:x.cycle,step:x.step,checkId:x.id,note:x.name});let next=checklistItems().find(z=>itemStatus(z).type==='open');db.checklist={...(db.checklist?.day===localDate()?db.checklist:{}),day:localDate(),focusId:next?.id||x.id};persist();render()}return}if(a==='reopen-item'){let x=checklistItems().find(x=>x.id===itemId);if(x){db.events=db.events.filter(e=>!(e.type==='skip'&&e.checkId===x.id&&e.day===localDate()));persist();render()}return}if(a==='back'){previousStep();return}if(a==='manage-day'){tab='today';render();requestAnimationFrame(()=>document.getElementById('day-controls')?.scrollIntoView({block:'center',behavior:'smooth'}));return}if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download=`sunny-backup-${localDate()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notice='Backup downloaded. Keep it safe.';render();return}if(a==='restart-day'||a==='delete-day'){if(!confirm(a==='restart-day'?'Remove today’s events and start again? Earlier days stay.':'Delete today’s events? Earlier days stay.'))return;let d=localDate();db.events=db.events.filter(e=>localDate(new Date(e.at))!==d);db.training=db.training.filter(x=>localDate(new Date(x.at))!==d);db.session=null;db.checklist={};db.trainingSession=null;if(db.checklist.windowDays)delete db.checklist.windowDays[d];windowUndo=null;if(a==='restart-day'){db.session={day:d,cycle:0,step:0,mode:'cycle',planVersion:2,started:Date.now(),wakeStart:Date.now(),finished:false};log('day-start')}persist();tab='now';notice=a==='restart-day'?'Day restarted.':'Day deleted.';render();return}if(a==='start'){if(s&&!s.finished)return;if(s?.finished&&s.day===localDate()){notice='Today is complete. Restart or delete today in 24 hours if you need to begin again.';render();return}db.session={day:localDate(),cycle:0,step:0,mode:'cycle',planVersion:2,started:Date.now(),wakeStart:Date.now(),finished:false};log('day-start');render();return}if(['quick-potty','quick-potty-no','quick-meal','accident','stress','crate-in','crate-out','door-open','door-closed','water','night-potty'].includes(a)){record(a==='quick-potty'?'potty':a==='quick-potty-no'?'potty-no':a==='quick-meal'?'meal':a);return}if(!s||s.finished)return;if(a==='wind'){if(!confirm('Move to wind-down now? The current cycle will end.'))return;log('skip',{note:`End cycle at ${phase()?.name}`});s.mode='wind';s.started=Date.now();persist();render();return}if(a==='return-step'){advanceStep();return}if(a==='potty-success'||a==='potty-no'){if(s.redo?.length)advanceStep();else record(a,true);return}if(a==='meal-done'){if(s.redo?.length)advanceStep();else record('meal',true);return}if(a==='next'||a==='skip')advanceStep(a==='skip')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-tab],[data-edit],[data-card],[data-outcome],[data-train-start],[data-train-pick],[data-train-tier],[data-train-next],[data-train-rep],[data-train-finish],[data-train-close]');if(!b)return;if(b.hasAttribute('data-train-start'))startTraining(b.dataset.trainStart);else if(b.hasAttribute('data-train-rep')){if(db.trainingSession){db.trainingSession.reps=Math.max(0,Math.min(5,(+db.trainingSession.reps||0)+Number(b.dataset.trainRep)));persist();trainingModal()}}else if(b.hasAttribute('data-train-finish'))finishTraining(b.dataset.trainFinish);else if(b.hasAttribute('data-train-close'))document.getElementById('training-session').close();else if(b.dataset.trainTier){let tier=+b.dataset.trainTier;if([8,10,16].includes(tier)){db.trainingPlan={...db.trainingPlan,tier};persist();render()}}else if(b.dataset.trainPick){if(trainingChoices().some(x=>x.id===b.dataset.trainPick)){db.trainingPlan={...db.trainingPlan,choice:b.dataset.trainPick};persist();render()}}else if(b.hasAttribute('data-train-next')){let choices=trainingChoices(),i=choices.findIndex(x=>x.id===currentExercise().id);if(trainingStats(currentExercise().id).ready&&i>=0&&i<choices.length-1){db.trainingPlan={...db.trainingPlan,choice:choices[i+1].id};persist();render()}}else if(b.dataset.tab){tab=b.dataset.tab;notice='';render();scrollTo(0,0)}else if(b.dataset.edit)edit(b.dataset.edit);else if(b.dataset.card){let f=b.dataset.feedback,id=b.dataset.card;db.training.push({id:uid(),card:id,feedback:f,at:Date.now()});if(f!=='sleeping')db.events.push({id:uid(),type:'training',card:id,at:Date.now(),day:localDate()});persist();render()}else if(b.dataset.outcome)markItem(b.dataset.item,b.dataset.outcome);else handleAction(b.dataset.act,b.dataset.item)});
document.addEventListener('submit',e=>{if(e.target.id!=='cfg')return;e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f.entries());v.night=f.has('night');db.cfg=sanitizeCfg({...db.cfg,...v});persist();notice='Guides saved. Existing events keep their real times.';render()});
document.addEventListener('change',e=>{if(e.target.id==='retro-date'&&e.target.value){retro.date=e.target.value;retro.msg=''}else if(e.target.id==='retro-time'&&e.target.value){retro.time=e.target.value;retro.msg=''}});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;let file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('Backup is too large.');let v=JSON.parse(await file.text());if(v.version!==1||!Array.isArray(v.events)||v.events.length>50000||!v.cfg||typeof v.cfg!=='object')throw Error('Not a Sunny backup.');if(!confirm('Replace Sunny data on this device? Export the current data first if needed.'))return;let old=db;db=normalizeData(v);if(!persist()){db=old;throw Error('Could not save the backup.')}notice='Backup imported.';syncNow();tab='now';render()}catch(err){notice=err.message||'Could not read backup.';render()}});
function tickTimers(){tick=Date.now();let el=document.getElementById('step-timer');if(el){let from=Number(el.dataset.start),d=Number(el.dataset.duration)*60000,ms=d-(tick-from);el.textContent=d?(ms<0?'+':'')+duration(Math.abs(ms)):duration(tick-from);el.classList.toggle('over',d>0&&ms<0)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickTimers();syncNow()}});setTimeout(syncNow,200);render();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sunny-rhythm/sw.js',{scope:'/sunny-rhythm/'}).catch(()=>{});
</script></body></html>
