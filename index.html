background:#fff;color:var(--ink);min-height:43px}.field textarea{min-height:70px}.details{font-size:13px;line-height:1.65}.details ol{padding-right:21px;margin:8px 0}.details p{margin:8px 0}.details a{color:#745024;overflow-wrap:anywhere}.track{margin-top:26px}.track h2{font-size:21px;margin:0 0 4px}.feedback{display:flex;gap:6px;flex-wrap:wrap}.feedback button{padding:8px 10px;font-size:12px}.empty{text-align:center;padding:25px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.foot{font-size:11px;line-height:1.6;color:#8b857b;margin:22px 0}.dialog{max-width:min(440px,95vw);width:100%;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 60px #0003}.dialog::backdrop{background:#29251d88}.dialog h2{margin:0}.dialog .row{margin-top:16px}.dialog button{flex:1}@media(max-width:360px){.button-grid{grid-template-columns:1fr}.statline{gap:5px}.stat{padding:9px}}

:root{--bg:#fffefa;--ink:#302c25;--muted:#827b70;--gold:#f4d895}body{direction:ltr}main{max-width:680px}.top{margin-bottom:24px}.sun{width:62px;height:62px}.hero{padding:14px 0 8px}.hero h1{font-size:clamp(42px,10vw,68px);line-height:1.04;letter-spacing:-.06em;margin:13px 0}.hero p{max-width:490px}.focus{background:#fff8e9;border:1px solid #eadbbb;border-radius:27px;padding:22px;margin:16px 0 12px;box-shadow:0 14px 35px #4535140a}.focus h2{font-size:clamp(36px,10vw,58px);letter-spacing:-.065em;margin:9px 0}.focus .timer{font-size:clamp(46px,14vw,78px);font-weight:800}.focus .timer.over{color:#a46739}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a5793c;font-weight:800}.steps{list-style:none;margin:0;padding:0}.steps li{display:flex;gap:12px;border-bottom:1px solid var(--line);padding:13px 2px;font-size:14px}.steps li:last-child{border:0}.steps time{font-variant-numeric:tabular-nums;min-width:49px;color:#aa7e3e;font-weight:700}.steps strong{display:block}.steps small{display:block;color:var(--muted);line-height:1.5}.progressbar{height:7px;border-radius:10px;background:#f0eee8;overflow:hidden;margin:13px 0}.progressbar i{display:block;height:100%;background:#f0c970}.details ol{padding-left:21px;padding-right:0}.nav button{min-width:57px}.field input[type=checkbox]{width:20px;min-height:20px}.soft{color:var(--muted);font-size:12px;line-height:1.5}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{padding:10px 4px;font-size:12px}.quick .secondary{background:#fff}.time-row{display:flex;gap:8px;align-items:center}.time-row input{flex:1}.entry button{white-space:nowrap}.tag{background:#fff0ce;border-radius:99px;padding:8px 11px;font-size:11px;font-weight:700;color:#815923}@media(max-width:380px){.quick{grid-template-columns:repeat(2,1fr)}.nav span{font-size:18px}}

const KEY='sunny.v1', LEGACY_KEY='sunny-rhythm-v1';
const SYNC_URL='https://sunny-forge-sync.roi-butbul22.workers.dev/v2/sunny-6271f463d07a4d5181d61691214d11b4';
const SYNC_META='sunny.sync.v2';let syncMeta;try{syncMeta=JSON.parse(localStorage.getItem(SYNC_META)||'null')||{revision:null,pending:false}}catch(e){syncMeta={revision:null,pending:false}}let syncReady=false,syncBusy=false,syncTimer=null,syncState='Checking cloud backup…';
function setSyncState(v){syncState=v;if(tab==='settings')render()}
function meaningful(v){return !!(v&&v.version===1&&Array.isArray(v.events)&&(v.events.length||v.session||v.training?.length||JSON.stringify(sanitizeCfg(v.cfg))!==JSON.stringify(DEFAULT)))}
function markPending(){syncMeta.pending=true;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));if(syncReady){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500)}}
async function syncNow(){
  if(syncBusy||!navigator.onLine)return;
  syncBusy=true;
  try{
    let res=await fetch(SYNC_URL,{cache:'no-store'});
    if(!res.ok)throw Error('Cloud unavailable');
    let remote=await res.json();
    if(remote.revision&&(!remote.data||remote.data.version!==1||!Array.isArray(remote.data.events)||!remote.data.cfg))throw Error('Invalid cloud copy');
    let hasLocal=meaningful(db);
    if(!syncReady){
      syncReady=true;
      if(!hasLocal&&!syncMeta.pending&&remote.revision){
        db=normalizeData(remote.data);
        localStorage.setItem(KEY,JSON.stringify(db));syncMeta={revision:remote.revision,pending:false};localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));
        setSyncState('Restored from cloud.');render();return;
      }
      if(hasLocal&&!remote.revision&&!syncMeta.revision){syncMeta.pending=true;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta))}
      if(!hasLocal&&!remote.revision){syncMeta.pending=false;syncMeta.revision=null;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta))}
    }
    if(remote.revision!==syncMeta.revision){
      if(syncMeta.pending||hasLocal&&syncMeta.revision===null){setSyncState('Cloud changed elsewhere. Your device stays unchanged. Export its backup before merging.');return}
      if(remote.revision){
        db=normalizeData(remote.data);
        localStorage.setItem(KEY,JSON.stringify(db));syncMeta={revision:remote.revision,pending:false};localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));
        setSyncState('Updated from cloud.');render();return;
      }
      setSyncState('Cloud copy changed. Your device stays unchanged. Export a backup.');return;
    }
    if(!syncMeta.pending){setSyncState(hasLocal?'Cloud backup up to date.':'No data to back up yet.');return}
    if(!meaningful(db)){syncMeta.pending=false;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));setSyncState('No data to back up yet.');return}
    let snapshot=JSON.stringify(db),payload={baseRevision:syncMeta.revision,data:JSON.parse(snapshot)};
    let put=await fetch(SYNC_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(put.status===409){setSyncState('Cloud changed elsewhere. Your device stays unchanged. Export a backup before merging.');return}
    if(!put.ok)throw Error('Cloud backup failed');
    let saved=await put.json();syncMeta={revision:saved.revision,pending:JSON.stringify(db)!==snapshot};localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));
    setSyncState(syncMeta.pending?'Uploading latest changes…':'Cloud backup up to date.');if(syncMeta.pending)setTimeout(syncNow,1500);
  }catch(e){setSyncState('Saved on this device; cloud backup will retry when connected.')}
  finally{syncBusy=false}
}
window.addEventListener('online',()=>syncNow());window.addEventListener('focus',()=>syncNow());
setInterval(()=>{if(document.visibilityState==='visible')syncNow()},60000);


const DEFAULT={wake:'07:00',bed:'23:00',meals:4,night:true,potty:10,meal:15,play:10,cooldown:20,nap:75,wakeMin:45,wakeMax:90,food:'Monge'};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const time=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const date=t=>new Date(t).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const clock=t=>new Date(t).toLocaleString('en-GB',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
const duration=ms=>{let s=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
const mins=ms=>`${Math.max(0,Math.round(ms/60000))} min`;
function sanitizeCfg(v){let s={...DEFAULT};if(!v||typeof v!=='object')return s;for(const k of ['wake','bed'])if(/^([01]\d|2[0-3]):[0-5]\d$/.test(v[k]))s[k]=v[k];for(const k of ['potty','meal','play','cooldown','nap','wakeMin','wakeMax'])if(Number.isFinite(+v[k]))s[k]=Math.max(1,Math.min(240,Math.round(+v[k])));s.meals=4;s.night=v.night!==false;s.food='Monge';if(s.wakeMax<s.wakeMin)s.wakeMax=s.wakeMin;return s}
function normalizeData(v){return {version:1,cfg:sanitizeCfg(v.cfg),events:v.events.filter(x=>x&&typeof x.type==='string'&&Number.isFinite(x.at)&&x.at>0).slice(-30000).map(e=>({...e,id:e.id||uid()})),training:Array.isArray(v.training)?v.training.filter(x=>x&&typeof x.card==='string'&&Number.isFinite(x.at)).slice(-10000):[],session:validSession(v.session)?v.session:null}}
function validSession(s){return s&&typeof s==='object'&&Number.isFinite(s.started)&&Number.isFinite(s.cycle)&&Number.isFinite(s.step)&&s.step>=0&&s.step<20&&s.cycle>=0&&s.cycle<6&&['cycle','wind','bed'].includes(s.mode)}
function load(){try{if(!localStorage.getItem(KEY)&&localStorage.getItem(LEGACY_KEY))localStorage.setItem(KEY,localStorage.getItem(LEGACY_KEY));let v=JSON.parse(localStorage.getItem(KEY));if(v?.version===1&&Array.isArray(v.events)&&v.events.length<50000)return normalizeData(v)}catch(e){}return {version:1,cfg:{...DEFAULT},events:[],training:[],session:null}}
let db=load(),tab='now',notice='',tick=Date.now();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));markPending();return true}catch(e){notice='Could not save on this device. Export a backup before continuing.';return false}}
function events(){return db.events.slice().sort((a,b)=>a.at-b.at||String(a.id).localeCompare(String(b.id)))}
function log(type,meta={}){let at=Date.now(),ev={id:uid(),type,at,day:localDate(new Date(at)),cycle:db.session?.cycle??null,step:db.session?.step??null,...meta};db.events.push(ev);persist();return ev}
function mealsAt(){return [0,2,3,4]}
function cycleKind(n){return ['Morning','Play','Midday','Enrichment','Evening','Bedtime'][n]||'Bedtime'}
function mealName(c){return ({0:'Breakfast',2:'Lunch',3:'Afternoon meal',4:'Dinner'})[c]||'Meal'}
function sequence(c){if(c===5)return [{name:'Wake up',kind:'wake',duration:0,detail:'One last gentle wake window.'},{name:'Quiet play',kind:'play',duration:db.cfg.play,detail:'Keep the last play gentle.'},{name:'Potty',kind:'potty',duration:db.cfg.potty,detail:'One last potty trip.'},{name:'Bedtime',kind:'bed',duration:0,detail:'Settle Sunny in for the night.'}];let seq=[{name:'Wake up',kind:'wake',duration:0,detail:'Sunny is up. Potty comes first.'},{name:'Potty',kind:'potty',duration:db.cfg.potty,detail:'Offer her a safe potty spot.'}];if(mealsAt().includes(c))seq.push({name:mealName(c),kind:'meal',duration:db.cfg.meal,detail:'A gentle meal. Note how much she eats.'});let kind=c===4?'training':c===3?'enrichment':'play';seq.push({name:c===0?'Play / train':c===4?'Training':c===3?'Enrichment':'Play',kind,duration:db.cfg.play,detail:c===3?'A short sniff, puzzle or gentle discovery.':'A short, puppy-paced activity.'},{name:'Potty',kind:'potty',duration:db.cfg.potty,detail:'Offer potty again after activity.'});if(c<2)seq.push({name:'Cool down',kind:'cooldown',duration:db.cfg.cooldown,detail:'Help her settle before sleep.'});seq.push({name:'Nap',kind:'nap',duration:db.cfg.nap,detail:'Let her rest; tap when she wakes.'});return seq}
function phase(s=db.session){if(!validSession(s)||s.finished)return null;if(s.mode==='wind')return {name:'Wind down',kind:'wind',duration:db.cfg.cooldown,detail:'Keep things gentle before bed.'};if(s.mode==='bed')return {name:'Bedtime',kind:'bed',duration:0,detail:'Settle Sunny in.'};return sequence(s.cycle)[s.step]||null}
function todayList(){return events().filter(e=>localDate(new Date(e.at))===localDate())}
function prediction(){let lastWake=null,samples=[];for(const e of events()){if(e.type==='wake'||e.type==='sleep-end')lastWake=e.at;else if(['potty','potty-success','potty-no','accident'].includes(e.type)&&lastWake){let d=(e.at-lastWake)/60000;if(d>=0&&d<=120&&e.type!=='accident')samples.push(d);lastWake=null}}if(samples.length<5)return '';let recent=samples.slice(-20),avg=Math.round(recent.reduce((a,b)=>a+b,0)/recent.length);return `From ${recent.length} logged wake-to-potty pairs, Sunny's average has been about ${avg} min. A pattern, not a deadline.`}
function preview(n=6){let s=db.session,at=s?.started||new Date(`${localDate()}T${db.cfg.wake}`).getTime(),items=[];if(!s||s.finished||!phase(s))return [];let mode=s.mode,cycle=s.cycle,step=s.step;for(let guard=0;items.length<n&&guard<60;guard++){let p=mode==='cycle'?sequence(cycle)[step]:mode==='wind'?{name:'Wind down',duration:db.cfg.cooldown,kind:'wind'}:{name:'Bedtime',duration:0,kind:'bed'};if(!p)break;items.push({...p,at});at=Math.max(Date.now(),at+Math.max(0,p.duration)*60000);if(mode==='wind'){mode='bed';continue}if(mode==='bed'||p.kind==='bed')break;if(p.kind==='nap'){cycle=Math.min(5,cycle+1);step=0}else step++}return items}
function render(){tick=Date.now();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('app').innerHTML=`<header class="top"><div class="brand">sunny<span>.</span></div><div class="date">${safe(date(tick))}</div></header>${notice?`<div class="notice" role="status">${safe(notice)}</div>`:''}${tab==='now'?renderNow():tab==='today'?renderToday():tab==='training'?renderTraining():tab==='history'?renderHistory():renderSettings()}`}
function renderNow(){let s=db.session,p=phase(),l=todayList(),n=l.filter(e=>e.type==='potty-success'||e.type==='potty'&&e.outcome==='success').length,m=l.filter(e=>e.type==='meal').length,nap=l.filter(e=>e.type==='nap').length,insight=prediction();if(!p)return `<section class="hero"><img class="sun" src="icon.svg?v=2" alt="A hand-drawn sun"><div class="eyebrow">Sunny's daily rhythm · ${safe(db.cfg.wake)} to ${safe(db.cfg.bed)}</div><h1>${s?.finished&&s.day===localDate()?'Good night, Sunny.':'A little day, together.'}</h1><p>Potty, food, play and rest, one step at a time. The plan moves with Sunny when you log what really happens.</p></section><section class="focus"><div class="eyebrow">${s?.finished&&s.day===localDate()?'Today is complete':'Ready when Sunny wakes'}</div><h2>${s?.finished&&s.day===localDate()?'Rest well.':'Wake → Potty'}</h2><p class="hint">Six cycles through the day, four meals, gentle 45–90 minute wake windows. Guides are flexible, not alarms.</p><button class="action full" data-act="start">${s?.finished&&s.day===localDate()?'Start another day':'Start Sunny’s day'} →</button></section>${insight?`<div class="notice">${safe(insight)}</div>`:''}<p class="foot">Tap when an activity really happens. No timer should keep her awake or delay a needed potty trip.</p>`;
let ms=p.duration*60000-(tick-s.started),over=p.duration&&ms<0,shown=over?`+${duration(-ms)}`:p.duration?duration(ms):duration(tick-s.started),seq=preview(),wakeElapsed=s.wakeStart?Math.round((tick-s.wakeStart)/60000):0;return `<section class="hero"><img class="sun" src="icon.svg?v=2" alt=""><div class="eyebrow">Sunny's day · ${safe(cycleKind(s.cycle))} · cycle ${s.cycle+1} of 6</div><h1>One sunny step<br>at a time.</h1><p>Today: ${n} potty wins · ${m}/4 meals · ${nap} naps</p><div class="progressbar"><i style="width:${Math.min(100,Math.round((s.cycle+Math.min(1,s.step/(sequence(s.cycle)?.length||1)))/6*100))}%"></i></div></section><section class="focus"><div class="row"><span class="tag">NOW · ${safe(time(s.started))}</span><span class="soft">${p.duration?`${p.duration} min guide`:'Follow her lead'}</span></div><h2>${safe(p.name)}</h2><div class="timer ${over?'over':''}" id="step-timer" data-start="${s.started}" data-duration="${p.duration}">${shown}</div><p class="hint">${safe(p.detail)} ${over?'The guide is up. Move on when she is ready.':''}</p>${p.kind==='potty'?`<div class="button-grid"><button class="action" data-act="potty-success">Went ✓</button><button class="secondary" data-act="potty-no">No result</button></div>`:p.kind==='meal'?`<button class="action full" data-act="meal-done">Meal finished →</button>`:`<button class="action full" data-act="next">${p.kind==='nap'?'Sunny woke up':p.kind==='bed'?'Finish day':'Done, next step'} →</button>`}<div class="quick" style="margin-top:10px"><button class="secondary" data-act="quick-potty">+ Potty</button><button class="secondary" data-act="quick-meal">+ Meal</button><button class="secondary" data-act="accident">+ Accident</button></div><div class="row"><button class="iconbtn" data-act="stress">+ Stress sign</button><button class="iconbtn" data-act="crate-in">+ Crate in</button><button class="iconbtn" data-act="crate-out">+ Crate out</button><button class="iconbtn" data-act="door">+ Door state</button><button class="iconbtn" data-act="skip">Skip step</button></div></section>${wakeElapsed>=db.cfg.wakeMax&&p.kind!=='nap'&&s.mode==='cycle'?`<div class="notice">Sunny has been awake about ${wakeElapsed} min. Her ${db.cfg.wakeMin}–${db.cfg.wakeMax} min wake window is a guide; consider rest.</div>`:''}<section class="card"><div class="row"><h2>Coming up</h2><span class="soft">Shifts with each tap</span></div><ol class="steps">${seq.slice(1,6).map((x,i)=>`<li><time>${safe(time(x.at))}</time><div><strong>${safe(x.name)}</strong><small>${x.duration?`${x.duration} min guide`: 'At her pace'}${i===0?' · next':''}</small></div></li>`).join('')}</ol></section>${insight?`<div class="notice">${safe(insight)}</div>`:''}${db.cfg.night?'<button class="secondary full" data-act="night-potty">+ Night potty</button>':''}<button class="secondary full" data-act="wind">Wind down early</button><p class="foot">Times are estimates, not reminders or medical advice. The schedule re-anchors to every recorded step.</p>`}

function renderTraining(){return `<div class="eyebrow">At her pace</div><h1>Sunny's training.</h1><p class="hint">Start with an open crate, potty opportunities and her name if she's receptive. Move to a closed door and short absences only when she is comfortable. Short 1–3 minute sessions, two to four opportunities a day, are a suggestion, not a target.</p>${tracks.map(t=>`<section class="track"><h2>${safe(t.title)}</h2>${t.cards.map(c=>{let logs=db.training.filter(x=>x.card===c.id),last=logs.at(-1);return `<article class="card"><div class="row"><h2>${safe(c.id)} · ${safe(c.name)}</h2><span class="chip">${safe(c.window)}</span></div><div class="details"><p><b>When:</b> ${safe(c.when)}</p><ol>${c.steps.map(x=>`<li>${safe(x)}</li>`).join('')}</ol><p><b>Reward:</b> ${safe(c.reward)}</p><p><b>Stop if:</b> ${safe(c.stop)}</p><p><b>Move on when:</b> ${safe(c.next)}</p><a href="${safe(c.source)}" target="_blank" rel="noopener">Source ↗</a></div><p class="soft">${logs.length?`${logs.length} sessions · last: ${last.feedback==='comfortable'?'comfortable':last.feedback==='hard'?'too hard':'skipped for sleep'}`:'No session logged yet'}</p><div class="feedback"><button class="secondary" data-card="${c.id}" data-feedback="comfortable">Comfortable</button><button class="secondary" data-card="${c.id}" data-feedback="hard">Too hard</button><button class="secondary" data-card="${c.id}" data-feedback="sleeping">Skipped · sleeping</button></div></article>`}).join('')}</section>`).join('')}<p class="foot">No streak, forced progression or crying it out. Persistent distress or crate soiling: ask a vet or reward-based trainer. Follow your vet's advice on safe outdoor exposure.</p>`}
function renderHistory(){let groups={};for(const e of events())(groups[localDate(new Date(e.at))]??=[]).push(e);return `<div class="eyebrow">Little moments add up</div><h1>History.</h1><p class="hint">Sunny's days, stored here and backed up when online.</p>${Object.keys(groups).sort().reverse().map(d=>`<section class="card"><h2>${safe(date(new Date(d+'T12:00')))}</h2>${groups[d].slice().reverse().map(entry).join('')}</section>`).join('')||'<div class="empty">Her first logged moment will appear here.</div>'}`}

function renderSettings(){return `<div class="eyebrow">Make it hers</div><h1>Settings.</h1><p class="hint">A flexible rhythm based on Sunny's six cycles. Four meals are built in.</p><form id="cfg"><section class="card"><h2>Her day</h2><div class="grid">${field('wake','Wake guide','time')}${field('bed','Bedtime guide','time')}${field('nap','Nap guide (min)')}</div><div class="field"><label><input name="night" type="checkbox" ${db.cfg.night?'checked':''}> Show night potty log</label></div></section><section class="card"><h2>Step guides</h2><div class="grid">${field('potty','Potty (min)')}${field('meal','Meal (min)')}${field('play','Play (min)')}${field('cooldown','Cool down (min)')}${field('wakeMin','Wake window from (min)')}${field('wakeMax','Wake window to (min)')}</div></section><button class="action full" type="submit">Save guides</button></form><section class="card"><h2>Backup</h2><div class="notice">Data stays on this device and syncs to Cloudflare online. There is no account sign-in: anyone with the backup room link can read or replace its cloud copy. Keep a JSON export before switching devices.</div><p class="soft" role="status">${safe(syncState)}</p><button class="secondary full" data-act="sync">Sync now</button><button class="secondary full" data-act="export" style="margin-top:8px">Export JSON backup</button><label class="secondary full" style="display:block;text-align:center;margin-top:8px">Import JSON backup<input type="file" id="import" accept="application/json,.json" style="display:none"></label><p class="soft">Import replaces Sunny's local history, not FORGE.</p></section><p class="foot">Guides are not alarms or veterinary advice. No predictions until enough real entries exist.</p>`}

function edit(id){let e=db.events.find(x=>x.id===id);if(!e)return;let dt=new Date(e.at),local=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);openForm(`Edit · ${names[e.type]||e.type}`,input('When did it happen?','at',local,'datetime-local')+optional(e.type)+input('Note (optional)','note',e.note||'')+`<button type="button" class="danger full" id="remove-event" style="margin-top:10px">Cancel this event</button>`,f=>{let at=new Date(f.get('at')).getTime();if(!Number.isFinite(at)||at>Date.now()+60000){notice='Choose a valid time, not in the future.';render();return}e.at=at;e.day=localDate(new Date(at));for(const [k,v] of f.entries())if(k!=='at')e[k]=v;persist();render()});document.getElementById('remove-event').onclick=()=>{if(confirm('Cancel this event?')){db.events=db.events.filter(x=>x.id!==id);persist();document.getElementById('editor').close('cancel');render()}};let form=document.getElementById('editor').querySelector('form');for(let k of ['door','outcome','location','amount','duration'])if(e[k]&&form.elements[k])form.elements[k].value=e[k]}
function advanceStep(skip=false,alreadyLogged=false){let s=db.session,p=phase();if(!p)return;let at=Date.now(),elapsed=Math.max(0,Math.round((at-s.started)/60000));if(p.kind==='bed'){log('bed');log('day-end');s.finished=true;persist();render();return}if(p.kind==='wind'){log('wind',{duration:elapsed});s.mode='bed';s.started=at;persist();render();return}if(skip)log('skip',{note:p.name});else if(!alreadyLogged){if(p.kind==='nap'){log('nap',{duration:elapsed});log('sleep-end')}else if(p.kind==='meal')log('meal',{label:p.name,duration:elapsed});else if(p.kind==='wake')log('wake');else if(p.kind!=='potty')log(p.kind,{duration:elapsed})}if(p.kind==='nap'){if(skip)log('sleep-end');s.cycle=Math.min(5,s.cycle+1);s.step=0;s.wakeStart=at}else{s.step++;if(p.kind==='wake')s.wakeStart=at} s.started=at;if(phase()?.kind==='nap')log('sleep-start');persist();render()}
function handleAction(a){notice='';let s=db.session;if(a==='sync'){syncNow();return}if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download=`sunny-backup-${localDate()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notice='Backup downloaded. Keep it safe.';render();return}if(a==='restart-day'||a==='delete-day'){if(!confirm(a==='restart-day'?'Remove today’s events and start again? Earlier days stay.':'Delete today’s events? Earlier days stay.'))return;let d=localDate();db.events=db.events.filter(e=>localDate(new Date(e.at))!==d);db.training=db.training.filter(x=>localDate(new Date(x.at))!==d);db.session=null;if(a==='restart-day'){db.session={day:d,cycle:0,step:0,mode:'cycle',started:Date.now(),wakeStart:Date.now(),finished:false};log('day-start')}persist();tab='now';notice=a==='restart-day'?'Day restarted.':'Day deleted.';render();return}if(a==='start'){if(s&&!s.finished)return;if(s?.finished&&s.day===localDate()){notice='Today is complete. Restart or delete today in 24 hours if you need to begin again.';render();return}db.session={day:localDate(),cycle:0,step:0,mode:'cycle',started:Date.now(),wakeStart:Date.now(),finished:false};log('day-start');render();return}if(['quick-potty','quick-meal','accident','stress','crate-in','crate-out','door','water','night-potty'].includes(a)){record(a==='quick-potty'?'potty':a==='quick-meal'?'meal':a);return}if(!s||s.finished)return;if(a==='wind'){if(!confirm('Move to wind-down now? The current cycle will end.'))return;log('skip',{note:`End cycle at ${phase()?.name}`});s.mode='wind';s.started=Date.now();persist();render();return}if(a==='potty-success'||a==='potty-no'){record(a,true);return}if(a==='meal-done'){record('meal',true);return}if(a==='next'||a==='skip')advanceStep(a==='skip')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-tab],[data-edit],[data-card]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;notice='';render();scrollTo(0,0)}else if(b.dataset.edit)edit(b.dataset.edit);else if(b.dataset.card){let f=b.dataset.feedback,id=b.dataset.card;db.training.push({id:uid(),card:id,feedback:f,at:Date.now()});if(f!=='sleeping')db.events.push({id:uid(),type:'training',card:id,at:Date.now(),day:localDate()});persist();render()}else handleAction(b.dataset.act)});
document.addEventListener('submit',e=>{if(e.target.id!=='cfg')return;e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f.entries());v.night=f.has('night');db.cfg=sanitizeCfg(v);persist();notice='Guides saved. The current step keeps its real start time.';render()});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;let file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('Backup is too large.');let v=JSON.parse(await file.text());if(v.version!==1||!Array.isArray(v.events)||v.events.length>50000||!v.cfg||typeof v.cfg!=='object')throw Error('Not a Sunny backup.');if(!confirm('Replace Sunny data on this device? Export the current data first if needed.'))return;let old=db;db=normalizeData(v);if(!persist()){db=old;throw Error('Could not save the backup.')}notice='Backup imported.';syncNow();tab='now';render()}catch(err){notice=err.message||'Could not read backup.';render()}});
function tickTimers(){tick=Date.now();let el=document.getElementById('step-timer');if(el){let from=Number(el.dataset.start),d=Number(el.dataset.duration)*60000,ms=d-(tick-from);el.textContent=d?(ms<0?'+':'')+duration(Math.abs(ms)):duration(tick-from);el.classList.toggle('over',d>0&&ms<0)}}
setInterval(tickTimers,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickTimers();syncNow()}});setTimeout(syncNow,200);render();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sunny-rhythm/sw.js',{scope:'/sunny-rhythm/'}).catch(()=>{});
</script></body></html>
