'use strict';
const KEY='sunny.v1', LEGACY_KEY='sunny-rhythm-v1';
const SYNC_URL='https://sunny-forge-sync.roi-butbul22.workers.dev/v2/sunny-6271f463d07a4d5181d61691214d11b4';
const SYNC_META='sunny.sync.v2';let syncMeta;try{syncMeta=JSON.parse(localStorage.getItem(SYNC_META)||'null')||{revision:null,pending:false}}catch(e){syncMeta={revision:null,pending:false}}let syncReady=false,syncBusy=false,syncTimer=null,syncState='בודק גיבוי ענן…';
function setSyncState(v){syncState=v;if(tab==='settings')render()}
function meaningful(v){return !!(v&&v.version===1&&Array.isArray(v.events)&&(v.events.length||v.session||v.training?.length||JSON.stringify(sanitizeCfg(v.cfg))!==JSON.stringify(DEFAULT)))}
function markPending(){syncMeta.pending=true;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));if(syncReady){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500)}}
async function syncNow(){
  if(syncBusy||!navigator.onLine)return;
  syncBusy=true;
  try{
    let res=await fetch(SYNC_URL,{cache:'no-store'});
    if(!res.ok)throw Error('Cloud unavailable');
    let remote=await res.json();
    if(remote.revision&&(!remote.data||remote.data.version!==1||!Array.isArray(remote.data.events)||!remote.data.cfg))throw Error('Invalid cloud copy');
    let hasLocal=meaningful(db);
    if(!syncReady){
      syncReady=true;
      if(!hasLocal&&!syncMeta.pending&&remote.revision){
        db=normalizeData(remote.data);
        localStorage.setItem(KEY,JSON.stringify(db));syncMeta={revision:remote.revision,pending:false};localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));
        setSyncState('שוחזר מן הענן.');render();return;
      }
      if(hasLocal&&!remote.revision&&!syncMeta.revision){syncMeta.pending=true;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta))}
      if(!hasLocal&&!remote.revision){syncMeta.pending=false;syncMeta.revision=null;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta))}
    }
    if(remote.revision!==syncMeta.revision){
      if(syncMeta.pending||hasLocal&&syncMeta.revision===null){setSyncState('הענן השתנה במכשיר אחר. הנתונים המקומיים נשמרו; ייצאו גיבוי לפני מיזוג.');return}
      if(remote.revision){
        db=normalizeData(remote.data);
        localStorage.setItem(KEY,JSON.stringify(db));syncMeta={revision:remote.revision,pending:false};localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));
        setSyncState('עודכן מן הענן.');render();return;
      }
      setSyncState('עותק הענן השתנה. המכשיר לא שונה; ייצאו גיבוי.');return;
    }
    if(!syncMeta.pending){setSyncState(hasLocal?'גיבוי הענן מעודכן.':'אין עדיין מידע לגיבוי.');return}
    if(!meaningful(db)){syncMeta.pending=false;localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));setSyncState('אין עדיין מידע לגיבוי.');return}
    let snapshot=JSON.stringify(db),payload={baseRevision:syncMeta.revision,data:JSON.parse(snapshot)};
    let put=await fetch(SYNC_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(put.status===409){setSyncState('הענן השתנה במכשיר אחר. ייצאו גיבוי לפני מיזוג.');return}
    if(!put.ok)throw Error('Cloud backup failed');
    let saved=await put.json();syncMeta={revision:saved.revision,pending:JSON.stringify(db)!==snapshot};localStorage.setItem(SYNC_META,JSON.stringify(syncMeta));
    setSyncState(syncMeta.pending?'מעלה את השינויים האחרונים…':'גיבוי הענן מעודכן.');if(syncMeta.pending)setTimeout(syncNow,1500);
  }catch(e){setSyncState('נשמר במכשיר; ננסה שוב לגבות כשיש חיבור.')}
  finally{syncBusy=false}
}

function sanitizeCfg(v){return {...DEFAULT,...(v&&typeof v==='object'?{wake:v.wake||DEFAULT.wake,bed:v.bed||DEFAULT.bed,meals:4,night:v.night!==false,food:DEFAULT.food}:{})}}
function normalizeData(v){return {version:1,cfg:sanitizeCfg(v.cfg),events:v.events.filter(x=>x&&typeof x.type==='string'&&Number.isFinite(x.at)&&x.at>0).slice(-30000).map(e=>({...e,id:e.id||uid()})),training:Array.isArray(v.training)?v.training.filter(x=>x&&typeof x.card==='string'&&Number.isFinite(x.at)).slice(-10000):[],session:v.session&&typeof v.session==='object'?v.session:null}}
function load(){try{if(!localStorage.getItem(KEY)&&localStorage.getItem(LEGACY_KEY))localStorage.setItem(KEY,localStorage.getItem(LEGACY_KEY));let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1&&Array.isArray(v.events)&&v.events.length<50000)return normalizeData(v)}catch(e){}return {version:1,cfg:{...DEFAULT},events:[],training:[],session:null}}
let db=load(),tab='now',notice='',tick=Date.now();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));markPending();return true}catch(e){notice='לא ניתן לשמור במכשיר. ייצאו גיבוי לפני המשך.';return false}}
function events(){return db.events.slice().sort((a,b)=>a.at-b.at||String(a.id).localeCompare(String(b.id)))}
function state(){let crate=null,sleep=null,door=null,inside=false,asleep=false;for(const e of events()){if(e.type==='crate-in'){inside=true;crate=e;door=e.door||null}else if(e.type==='crate-out'){inside=false;crate=null;door=null}else if(e.type==='door'){door=e.door||null}else if(e.type==='sleep-start'){asleep=true;sleep=e}else if(e.type==='sleep-end'){asleep=false;sleep=null}}return {crate,sleep,inside,asleep,door}}

function metrics(list=events(),end=tick){let crateStart=null,sleepStart=null,awakeInCrate=0,sleepTotal=0,crateTotal=0,latencies=[],night=0,wakes=0,potty=0,stresses=0,doors=[];for(const e of list){let at=e.at;if(e.type==='crate-in'){if(crateStart!==null)crateTotal+=Math.max(0,at-crateStart);crateStart=at;if(e.door)doors.push({at,door:e.door})}else if(e.type==='crate-out'&&crateStart!==null){crateTotal+=Math.max(0,at-crateStart);crateStart=null}else if(e.type==='door'&&e.door){doors.push({at,door:e.door})}else if(e.type==='sleep-start'){if(sleepStart!==null)sleepTotal+=Math.max(0,at-sleepStart);sleepStart=at;if(crateStart!==null)latencies.push(Math.max(0,at-crateStart))}else if(e.type==='sleep-end'&&sleepStart!==null){sleepTotal+=Math.max(0,at-sleepStart);sleepStart=null;wakes++;let hour=new Date(at).getHours();if(hour>=22||hour<6)night++}else if(e.type==='potty'||e.type==='potty-success'||e.type==='night-potty')potty++;else if(e.type==='stress')stresses++}
if(crateStart!==null)crateTotal+=Math.max(0,end-crateStart);if(sleepStart!==null)sleepTotal+=Math.max(0,end-sleepStart);
// Sum overlap of each crate interval with sleep intervals, including open intervals.
let ci=[],si=[],c=null,s=null;for(const e of list){if(e.type==='crate-in'){if(c!==null)ci.push([c,e.at]);c=e.at}else if(e.type==='crate-out'&&c!==null){ci.push([c,e.at]);c=null}else if(e.type==='sleep-start'){if(s!==null)si.push([s,e.at]);s=e.at}else if(e.type==='sleep-end'&&s!==null){si.push([s,e.at]);s=null}}if(c!==null)ci.push([c,end]);if(s!==null)si.push([s,end]);let overlap=0;for(const [a,b] of ci)for(const [x,y] of si)overlap+=Math.max(0,Math.min(b,y)-Math.max(a,x));awakeInCrate=Math.max(0,crateTotal-overlap);
return {sleepTotal,crateTotal,awakeInCrate,latencies,night,wakes,potty,stresses,doors}}
function stat(label,value){return `<div class="stat"><b>${safe(value)}</b><small>${safe(label)}</small></div>`}
function render(){tick=Date.now();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('app').innerHTML=`<header class="top"><div class="brand">sunny<span>.</span></div><div class="date">${safe(date(tick))}</div></header>${notice?`<div class="notice" role="status">${safe(notice)}</div>`:''}${tab==='now'?renderNow():tab==='today'?renderToday():tab==='training'?renderTraining():tab==='history'?renderHistory():renderSettings()}`}
function renderNow(){let s=state(),m=metrics(),today=events().filter(e=>localDate(new Date(e.at))===localDate());let meals=today.filter(e=>e.type==='meal').length,potties=today.filter(e=>e.type==='potty'&&e.outcome==='success'||e.type==='potty-success').length;return `<section class="hero"><img class="sun" src="icon.svg?v=2" alt=""><div class="eyebrow">יום אחד בכל פעם</div><h1>מה קורה עם סאני?</h1><p>מסמנים את מה שבאמת קרה. אין לוח זמנים קשיח, אזעקת שינה או חיזוי.</p></section><div class="grid"><article class="card timer-card" style="margin:0"><div class="eyebrow">זמן בכלוב</div><div class="timer" data-timer="crate" data-from="${s.crate?.at||0}">${s.crate?duration(tick-s.crate.at):'00:00:00'}</div><div class="tiny">${s.crate?`נכנסה ב-${time(s.crate.at)} · ${s.door?`דלת ${s.door==='closed'?'סגורה':'פתוחה'}`:'מצב דלת לא צוין'}`:'לא בכלוב כרגע'}</div></article><article class="card timer-card" style="margin:0"><div class="eyebrow">זמן שינה</div><div class="timer" data-timer="sleep" data-from="${s.sleep?.at||0}">${s.sleep?duration(tick-s.sleep.at):'00:00:00'}</div><div class="tiny">${s.sleep?`נרדמה ב-${time(s.sleep.at)} · גם מחוץ לכלוב אפשר לישון`:'ערה כרגע'}</div></article></div><section class="card"><h2>הרגעים החשובים</h2><div class="button-grid"><button class="action" data-act="crate-in" ${s.inside?'disabled':''}>נכנסה לכלוב</button><button class="secondary" data-act="crate-out" ${!s.inside?'disabled':''}>יצאה מהכלוב</button><button class="action" data-act="sleep-start" ${s.asleep?'disabled':''}>נרדמה</button><button class="secondary" data-act="sleep-end" ${!s.asleep?'disabled':''}>התעוררה</button></div>${s.asleep?'':`<p class="hint">אחרי התעוררות כדאי להציע יציאה לצרכים במקום בטוח לפי הווטרינר.</p>`}${s.inside?`<button class="secondary full" style="margin-top:10px" data-act="door">עדכון מצב הדלת (רשות)</button>`:''}<p class="tiny">זמן הכלוב וזמן השינה נמדדים בנפרד, גם כשהאפליקציה סגורה.</p></section><section class="card"><h2>לתעד בלי להתעכב</h2><div class="button-grid"><button class="secondary" data-act="potty">צרכים</button><button class="secondary" data-act="meal">ארוחה</button><button class="secondary" data-act="water">מים</button><button class="secondary" data-act="play">משחק</button><button class="secondary" data-act="training">אימון</button><button class="secondary" data-act="stress">סימן לחץ</button></div></section><div class="statline">${stat('ארוחות היום',`${meals}/4`)}${stat('הצלחות בצרכים',potties)}${stat('שינה שנרשמה',mins(m.sleepTotal))}</div><p class="hint">האוכל: אוכל Monge שהוזמן · ארבע ארוחות ביום בגיל 8 שבועות. הכמות לפי המוצר המדויק שעל השקית והווטרינר.</p><p class="foot">כלוב פתוח בתוך מתחם בטוח עדיף על כפייה כשהיא במצוקה. הכלוב לא עונש ולא תחליף לחברה או ליציאה לצרכים.</p>`}
function entry(e){let bits=[];if(e.type==='meal')bits.push(e.amount?`${e.amount} גרם · ${db.cfg.food}`:db.cfg.food);if(e.type==='potty'||e.type==='accident')bits.push(`${e.outcome==='success'?'הצלחה':e.outcome==='accident'?'תאונה':'לא הצליח'}${e.location?' · '+e.location:''}${e.trigger?' · אחרי '+e.trigger:''}`);if(e.type==='door'||e.type==='crate-in'&&e.door)bits.push(e.door==='closed'?'דלת סגורה':e.door==='open'?'דלת פתוחה':'');if(e.type==='training')bits.push(e.card||'מפגש');if(e.note)bits.push(e.note);let details=bits.filter(Boolean).join(' · ');return `<div class="entry"><time>${safe(clock(e.at))}</time><div class="body"><strong>${safe(names[e.type]||e.type)}</strong>${details?`<small>${safe(details)}</small>`:''}</div><button class="iconbtn" data-edit="${safe(e.id)}" aria-label="תיקון ${safe(names[e.type]||e.type)}">עריכה</button></div>`}
function renderToday(){let now=Date.now(),all=events(),cut=now-86400000,list=all.filter(e=>e.at>=cut&&e.at<=now),before=all.filter(e=>e.at<cut),cs=null,ss=null;for(const e of before){if(e.type==='crate-in')cs=e;else if(e.type==='crate-out')cs=null;else if(e.type==='sleep-start')ss=e;else if(e.type==='sleep-end')ss=null}let seed=[...(cs?[{...cs,at:cut}]:[]),...(ss?[{...ss,at:cut}]:[])],m=metrics([...seed,...list]);return `<div class="eyebrow">מה באמת קרה</div><h1>24 השעות האחרונות</h1><p class="hint">לוח זמנים לפי חותמות זמן. אפשר לתקן לחיצה מאוחרת או לבטל אירוע שגוי.</p><div class="statline">${stat('שינה נטו',mins(m.sleepTotal))}${stat('ערה בכלוב',mins(m.awakeInCrate))}${stat('יקיצות בלילה',m.night)}</div><section class="card"><h2>דפוסים</h2><p class="hint">מהכניסה לכלוב עד הירדמות: ${m.latencies.length?m.latencies.slice(-3).map(mins).join(' · '):'עדיין אין זוג אירועים מתועד'}</p><p class="hint">יקיצות מתועדות: ${m.wakes} · צרכים: ${m.potty} · סימני לחץ: ${m.stresses}</p><p class="hint">מצבי דלת שתועדו: ${m.doors.length?m.doors.slice(-4).map(x=>`${time(x.at)} ${x.door==='closed'?'סגורה':'פתוחה'}`).join(' · '):'לא צוינו'}</p><p class="tiny">יקיצת לילה נספרת בין 22:00 ל-06:00. זמנים ללא לחיצה אינם ניחוש.</p></section><h2 class="section-title">ציר זמן</h2>${list.length?`<section class="card">${list.slice().reverse().map(entry).join('')}</section>`:'<div class="empty">עדיין אין אירועים ב-24 השעות האחרונות.</div>'}<section class="card"><h2>היום הזה</h2><p class="tiny">הפעולות הבאות מוחקות רק אירועים מתאריך היום במכשיר ובסנכרון, לא את הימים הקודמים.</p><div class="button-grid"><button class="secondary" data-act="restart-day">להתחיל את היום מחדש</button><button class="danger" data-act="delete-day">למחוק את היום</button></div></section>`}
function renderTraining(){return `<div class="eyebrow">לומדים בקצב שלה</div><h1>תוכנית האילוף</h1><p class="hint">בימים 1–3: A0, צרכים ושם אם היא פנויה. בימים 4–7: A1 ואולי A2 רק אם נוח. בשבוע השני: A2 ו-A3 רק כשנינוחה, יחד עם ״אליי״, החלפה והיכרות. בשבועות 10–16 מכלילים בהדרגה לפי יכולתה והווטרינר. אלה הצעות, לא יעדי גיל. מפגש קצר של 1–3 דקות, 2–4 הזדמנויות ביום, הוא הצעת שימוש בלבד.</p>${tracks.map(t=>`<section class="track"><h2>${safe(t.title)}</h2>${t.cards.map(c=>{let logs=db.training.filter(x=>x.card===c.id),last=logs.at(-1);return `<article class="card"><div class="row"><h2>${safe(c.id)} · ${safe(c.name)}</h2><span class="chip">${safe(c.window)}</span></div><div class="details"><p><b>מתי לתרגל:</b> ${safe(c.when)}</p><ol>${c.steps.map(x=>`<li>${safe(x)}</li>`).join('')}</ol><p><b>מה לתגמל:</b> ${safe(c.reward)}</p><p><b>מתי לעצור:</b> ${safe(c.stop)}</p><p><b>מתי להתקדם:</b> ${safe(c.next)}</p><a href="${safe(c.source)}" target="_blank" rel="noopener">המקור ↗</a></div><p class="tiny">${logs.length?`${logs.length} מפגשים · האחרון: ${last.feedback==='comfortable'?'היה לה נוח':last.feedback==='hard'?'היה קשה מדי':'דילגנו כי ישנה'}`:'אין מפגש מתועד'}</p><div class="feedback"><button class="secondary" data-card="${c.id}" data-feedback="comfortable">היה לה נוח</button><button class="secondary" data-card="${c.id}" data-feedback="hard">היה קשה מדי</button><button class="secondary" data-card="${c.id}" data-feedback="sleeping">דילגנו כי ישנה</button></div></article>`}).join('')}</section>`).join('')}<p class="foot">אין רצף, קידום אוטומטי או ״לבכות עד שתירגע״. מצוקה ממושכת או לכלוך בכלוב: התייעצו עם וטרינר או מאלף מבוסס חיזוקים. ישיבה, רצועה ושטיח יכולים לחכות לבסיס הכלוב, הצרכים והשם. בלילה: צרכים לפני שינה, קרבה לאדם, ויקיצה לצרכים בשקט וחזרה.</p>`}
function renderHistory(){let groups={};for(const e of events())(groups[localDate(new Date(e.at))]??=[]).push(e);let days=Object.keys(groups).sort().reverse();return `<div class="eyebrow">הדרך של סאני</div><h1>היסטוריה</h1><p class="hint">הרישומים נשמרים במכשיר ומגובים לענן כשיש חיבור. ייצאו גיבוי מדי פעם.</p>${days.length?days.map(d=>`<section class="card"><h2>${safe(date(new Date(d+'T12:00')))}</h2>${groups[d].slice().reverse().map(entry).join('')}</section>`).join(''):'<div class="empty">היומן יופיע כאן לאחר האירוע הראשון.</div>'}`}
function renderSettings(){return `<div class="eyebrow">הנתונים שלכם</div><h1>הגדרות וגיבוי</h1><section class="card"><h2>תזונה</h2><p class="hint">Monge · ארבע ארוחות ביום בגיל 8 שבועות. הכמות לפי המוצר המדויק שעל השקית והווטרינר; תאריכי החיסון לפי הווטרינר.</p></section><section class="card"><h2>גיבוי</h2><div class="notice">המידע נשמר במכשיר ומסתנכרן לענן כשמחוברים. אין כניסה לחשבון: מי שמחזיק את קישור הגיבוי יכול לקרוא או להחליף את המידע בענן. ייצאו JSON לפני החלפת מכשיר.</div><p class="tiny" role="status">${safe(syncState)}</p><button class="secondary full" data-act="sync">לסנכרן עכשיו</button><button class="secondary full" data-act="export" style="margin-top:8px">לייצא גיבוי JSON</button><label class="secondary full" style="display:block;text-align:center;margin-top:8px">לייבא גיבוי JSON<input type="file" id="import" accept="application/json,.json" style="display:none"></label><p class="tiny">ייבוא מחליף את יומן סאני במכשיר הזה, לא את FORGE.</p></section><p class="foot">היומן מסייע במעקב, אך אינו מחליף וטרינר. היעדר אירוע מתועד לא מעיד שפעולה לא קרתה.</p>`}
function openForm(title,body,save){let d=document.getElementById('editor');d.innerHTML=`<form method="dialog"><h2>${safe(title)}</h2>${body}<div class="row"><button class="secondary" value="cancel">ביטול</button><button class="action" value="save">שמירה</button></div></form>`;d.showModal();d.addEventListener('close',()=>{if(d.returnValue==='save')save(new FormData(d.querySelector('form')))}, {once:true})}
const input=(label,name,value='',type='text')=>`<div class="field"><label>${safe(label)}<input name="${safe(name)}" type="${type}" value="${safe(value)}"></label></div>`;
const select=(label,name,opts)=>`<div class="field"><label>${safe(label)}<select name="${safe(name)}">${opts.map(([v,t])=>`<option value="${safe(v)}">${safe(t)}</option>`).join('')}</select></label></div>`;
function optional(type){if(type==='crate-in'||type==='door')return select('מצב הדלת (רשות)','door',[['','לא צוין'],['open','פתוחה'],['closed','סגורה']]);if(type==='potty')return select('מה קרה','outcome',[['success','הצלחה'],['no-result','לא הצליח'],['accident','תאונה']])+input('מיקום (רשות)','location')+select('אחרי מה? (רשות)','trigger',[['','לא צוין'],['התעוררות','התעוררות'],['אוכל','אוכל'],['שתייה','שתייה'],['משחק','משחק'],['לפני שינה','לפני שינה'],['אחר','אחר']]);if(type==='meal')return input('כמות בגרמים (רשות)','amount','','number');return ''}
function record(type){let s=state();if(type==='crate-in'&&s.inside||type==='crate-out'&&!s.inside||type==='sleep-start'&&s.asleep||type==='sleep-end'&&!s.asleep){notice='האירוע הזה כבר במצב הנוכחי. אפשר לתקן אותו ביומן.';render();return}let title=names[type];openForm(title,optional(type)+input('הערה (רשות)','note'),f=>{let meta=Object.fromEntries(f.entries());if(type==='potty'&&meta.outcome==='accident')meta.location=meta.location||'בבית';if(type==='meal'&&meta.amount&&(!Number.isFinite(+meta.amount)||+meta.amount<=0)){notice='הכמות צריכה להיות מספר חיובי.';render();return}if(type==='door'&&!meta.door){notice='בחרו מצב דלת כדי לשמור.';render();return}log(type,meta);if(type==='sleep-end')notice='סאני התעוררה. כדאי להציע צרכים עכשיו.';render()})}
function edit(id){let e=db.events.find(x=>x.id===id);if(!e)return;let dt=new Date(e.at);let local=new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16);openForm(`תיקון · ${names[e.type]||e.type}`,input('מתי באמת קרה?','at',local,'datetime-local')+optional(e.type)+input('הערה (רשות)','note',e.note||'')+`<button type="button" class="danger full" style="margin-top:10px" id="remove-event">ביטול האירוע הזה</button>`,f=>{let t=new Date(f.get('at')).getTime();if(!Number.isFinite(t)||t>Date.now()+60000){notice='השעה אינה תקינה או נמצאת בעתיד.';render();return}e.at=t;e.day=localDate(new Date(t));for(const [k,v] of f.entries())if(k!=='at')e[k]=v;persist();render()});document.getElementById('remove-event').onclick=()=>{if(confirm('לבטל את האירוע הזה?')){db.events=db.events.filter(x=>x.id!==id);persist();document.getElementById('editor').close('cancel');render()}};let form=document.getElementById('editor').querySelector('form');for(const k of ['door','outcome','trigger','location','amount'])if(e[k]&&form.elements[k])form.elements[k].value=e[k]}
function handleAction(a){notice='';if(a==='sync'){syncNow();return}if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download=`sunny-backup-${localDate()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notice='הגיבוי ירד למכשיר. שמרו אותו במקום בטוח.';render();return}if(a==='restart-day'||a==='delete-day'){if(!confirm(a==='restart-day'?'למחוק את רישומי היום ולהתחיל מחדש? ימים קודמים יישארו.':'למחוק את רישומי היום? ימים קודמים יישארו.'))return;let d=localDate();db.events=db.events.filter(e=>localDate(new Date(e.at))!==d);db.training=db.training.filter(x=>localDate(new Date(x.at))!==d);db.session=null;if(a==='restart-day')db.events.push({id:uid(),type:'day-start',at:Date.now(),day:d});persist();notice=a==='restart-day'?'היום התחיל מחדש.':'היום נמחק.';tab='now';render();scrollTo(0,0);return}record(a)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-tab],[data-edit],[data-card]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;notice='';render();scrollTo(0,0)}else if(b.dataset.edit)edit(b.dataset.edit);else if(b.dataset.card){let f=b.dataset.feedback,id=b.dataset.card;db.training.push({id:uid(),card:id,feedback:f,at:Date.now()});if(f!=='sleeping')db.events.push({id:uid(),type:'training',card:id,at:Date.now(),day:localDate()});persist();render()}else handleAction(b.dataset.act)});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;let file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('הגיבוי גדול מדי.');let v=JSON.parse(await file.text());if(v.version!==1||!Array.isArray(v.events)||v.events.length>50000||!v.cfg)throw Error('זה אינו גיבוי של סאני.');if(!confirm('להחליף את הנתונים במכשיר הזה בגיבוי? ייצאו את הנתונים הנוכחיים קודם אם צריך.'))return;let old=db;db=normalizeData(v);if(!persist()){db=old;throw Error('לא ניתן לשמור את הגיבוי.')}notice='הגיבוי יובא.';syncNow();tab='now';render()}catch(err){notice=err.message||'לא ניתן לקרוא את הגיבוי.';render()}});
function tickTimers(){tick=Date.now();for(const el of document.querySelectorAll('[data-timer]')){let from=Number(el.dataset.from);if(from)el.textContent=duration(tick-from)}}
setInterval(tickTimers,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tickTimers();syncNow()}});setTimeout(syncNow,200);render();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sunny-rhythm/sw.js',{scope:'/sunny-rhythm/'}).catch(()=>{});
</script></body></html>
