<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1920"><meta name="description" content="A gentle, flexible daily rhythm for Sunny."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Sunny | A day at a time</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#0d1920;--panel:#17272d;--panel2:#1e3036;--line:#31434a;--ink:#f6f3e9;--muted:#a4b1ae;--mint:#b8edc9;--orange:#edc38b;--pink:#e9b9ae;--blue:#afd6e9;font-family:'DM Sans',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:3px}main{max-width:640px;margin:auto;padding:calc(env(safe-area-inset-top) + 28px) 22px calc(114px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:46px}.brand{font-family:Manrope,sans-serif;font-weight:800;letter-spacing:-.055em;font-size:26px}.brand span{color:var(--orange)}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--mint)}.date{font-size:12px;color:var(--muted)}.tag{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#17272d;padding:9px 12px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--mint)}.dot{width:7px;height:7px;background:currentColor;border-radius:50%}.hero{min-height:440px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:10px 0 26px}.hero h1{font-family:Manrope,sans-serif;font-size:clamp(56px,15vw,96px);line-height:.98;letter-spacing:-.085em;margin:22px 0 20px;font-weight:800;max-width:600px;overflow-wrap:break-word}.hero .big-time{font-family:Manrope,sans-serif;font-size:clamp(56px,17vw,108px);line-height:1;letter-spacing:-.09em;font-weight:800;margin:0 0 8px;font-variant-numeric:tabular-nums}.hero p{color:var(--muted);line-height:1.5;font-size:15px;max-width:420px;margin:0}.hero .accent{color:var(--mint)}.progress{height:3px;background:var(--line);border-radius:10px;overflow:hidden;margin:8px 0 24px}.progress>i{display:block;height:100%;background:var(--mint);transition:width .5s}.card{background:var(--panel);border:1px solid #2b3d42;border-radius:28px;padding:23px;margin-top:16px;box-shadow:0 12px 40px #07121825}.card h2,.section-title{font:800 20px Manrope,sans-serif;letter-spacing:-.045em;margin:0 0 15px}.muted{color:var(--muted)}.mini{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.action{width:100%;border:0;background:var(--mint);color:#10241d;border-radius:18px;padding:18px 20px;font-weight:800;font-size:15px;margin-top:10px}.action:active{transform:scale(.99)}.secondary{width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;padding:14px;font-size:13px;font-weight:700;margin-top:10px}.textbtn{border:0;background:transparent;color:var(--muted);padding:12px 0;font-weight:700;font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.split .action{margin-top:10px}.statline{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:12px 14px;flex:1;min-width:95px}.stat b{display:block;font:800 21px Manrope}.stat span{font-size:11px;color:var(--muted)}.section{margin-top:34px}.list{display:grid;gap:9px}.entry{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid #2b3d42;border-radius:17px;padding:13px 15px;min-height:64px}.symbol{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#30433f;color:var(--mint);font-size:18px;flex:none}.entry b{display:block;font-size:13px}.entry small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.entry time{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}.nav{position:fixed;bottom:0;left:0;right:0;background:#102026ee;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px max(18px, calc((100vw - 620px)/2)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:5}.nav button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:10px 13px;border-radius:13px}.nav button.active{background:#263c38;color:var(--mint)}.nav button span{display:block;font-size:21px;margin-bottom:5px}.field{display:grid;gap:8px;margin:18px 0}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);background:#0e1d23;color:var(--ink);border-radius:13px;padding:13px 14px;min-height:46px}.field .hint{font-size:11px;color:var(--muted);line-height:1.45}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.callout{padding:16px;background:#21362f;border:1px solid #3d6251;border-radius:16px;color:#d9f2dc;font-size:12px;line-height:1.5}.empty{text-align:center;padding:42px 22px;color:var(--muted);border:1px dashed var(--line);border-radius:20px}.dayhead{padding-bottom:16px;border-bottom:1px solid var(--line);margin:20px 0 14px}.dayhead b{font:800 20px Manrope}.dayhead small{display:block;color:var(--muted);margin-top:4px}.historyday{margin:26px 0}.quiet{font-size:11px;color:var(--muted);line-height:1.5}.pill{padding:7px 10px;border-radius:9px;background:#273a3e;font-size:10px;color:var(--muted);font-weight:700}.hero .paw{font-size:40px;color:var(--orange)}.footer-note{font-size:11px;line-height:1.5;color:#83938f;margin:20px 0}input[type=checkbox]{width:20px;height:20px;accent-color:var(--mint)}@media(min-width:750px){main{padding-top:44px}.hero{min-height:490px}}@media(max-width:370px){.hero h1{font-size:54px}.top{margin-bottom:20px}.settings-grid{grid-template-columns:1fr}}
</style></head><body><main id="app"></main><nav class="nav" aria-label="Main navigation"><button data-tab="now" class="active"><span>◉</span>Now</button><button data-tab="today"><span>▤</span>Today</button><button data-tab="history"><span>◷</span>History</button><button data-tab="settings"><span>⚙</span>Settings</button></nav><script>
'use strict';
const KEY='sunny.v1', LEGACY_KEY='sunny-rhythm-v1';
const DEFAULT={wake:'07:00',bed:'23:00',meals:3,night:true,potty:10,meal:15,play:10,cooldown:20,nap:75,wakeMin:45,wakeMax:90};
const safe=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const localDate=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const time=(t)=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const stamp=(d)=>d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const min=(a,b)=>Math.max(0,Math.ceil((a-b)/60000));
function sanitizeCfg(v){let s={...DEFAULT};if(!v||typeof v!=='object')return s;for(let k of ['wake','bed'])if(/^([01]\d|2[0-3]):[0-5]\d$/.test(v[k]))s[k]=v[k];for(let k of ['meals','potty','meal','play','cooldown','nap','wakeMin','wakeMax'])if(Number.isFinite(+v[k]))s[k]=Math.max(k==='meals'?1:1,Math.min(k==='meals'?5:240,Math.round(+v[k])));s.night=!!v.night;if(s.wakeMax<s.wakeMin)s.wakeMax=s.wakeMin;return s}
function load(){try{if(!localStorage.getItem(KEY)&&localStorage.getItem(LEGACY_KEY))localStorage.setItem(KEY,localStorage.getItem(LEGACY_KEY));let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1&&Array.isArray(v.events)&&v.events.length<50000)return {version:1,cfg:sanitizeCfg(v.cfg),events:v.events.filter(x=>x&&typeof x.type==='string'&&Number.isFinite(x.at)&&x.at>0).slice(-30000),session:v.session&&typeof v.session==='object'?v.session:null}}catch(e){}return {version:1,cfg:{...DEFAULT},events:[],session:null}}
let db=load(),tab='now',notice='',tick=Date.now();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notice='Storage is full or unavailable. Export a backup before continuing.';return false}}
function log(type,meta={}){const ev={id:uid(),type,at:Date.now(),day:db.session?.day||localDate(),cycle:db.session?.cycle??null,step:db.session?.step??null,outcome:type==='potty-success'?'outside':type==='potty-no'?'no-result':type==='accident'?'indoors':null,...meta};db.events.push(ev);return ev}
function completed(type){return db.events.filter(e=>e.day===db.session?.day&&e.type===type).length}
function mealsAt(){let n=db.cfg.meals;return n===1?[0]:n===2?[0,4]:n===3?[0,2,4]:n===4?[0,2,3,4]:[0,1,2,3,4]}
function cycleKind(n){return ['Morning','Play','Midday','Enrichment','Evening','Bedtime'][n]||'Bedtime'}
function mealName(i){const count=db.cfg.meals;return count===1?'Meal':i===0?'Breakfast':i===count-1?'Dinner':i===1?'Lunch':`Meal ${i+1}`}
function phase(s=db.session){if(!s||s.finished)return null;if(s.mode==='bed')return {name:'Bedtime',kind:'bed',duration:0,detail:'A quiet end to the day.'};if(s.mode==='wind')return {name:'Wind down',kind:'wind',duration:db.cfg.cooldown,detail:'Keep it gentle, then settle for bed.'};let p=s.step,c=s.cycle,m=mealsAt(),mi=m.indexOf(c),hasMeal=mi>=0,kind=cycleKind(c);
let seq=c===5?[{name:'Wake up',kind:'wake',duration:0,detail:'One last gentle wake window.'},{name:'Play',kind:'play',duration:db.cfg.play,detail:'Quiet play before bedtime.'},{name:'Potty',kind:'potty',duration:db.cfg.potty,detail:'Last potty trip before bed.'},{name:'Bedtime',kind:'bed',duration:0,detail:'Settle Sunny in for the night.'}]:[{name:'Wake up',kind:'wake',duration:0,detail:'Sunny is up. Start with a potty trip.'},{name:'Potty',kind:'potty',duration:db.cfg.potty,detail:'Take her to her safe potty spot.'}];
if(c!==5){if(hasMeal)seq.push({name:mealName(mi),kind:'meal',duration:db.cfg.meal,detail:'Log her meal when she finishes.'});seq.push({name:c===0?'Play / train':c===4?'Training':c===3?'Enrichment':'Play',kind:c===4?'training':c===3?'enrichment':'play',duration:db.cfg.play,detail:c===3?'A short sniff, puzzle or gentle discovery.':'A short, puppy-paced activity.'},{name:'Potty',kind:'potty',duration:db.cfg.potty,detail:'Offer another potty trip after activity.'});if(c<2)seq.push({name:'Cool down',kind:'cooldown',duration:db.cfg.cooldown,detail:'A calm transition before sleep.'});seq.push({name:'Nap',kind:'nap',duration:db.cfg.nap,detail:'Let her rest. Tap when she wakes.'})}return {...(seq[p]||seq[0]),total:seq.length,cycleKind:kind}}
function nowStepTime(){return db.session?.started||Date.now()}
function progress(s=db.session){if(!s)return 0;return Math.round(((s.step||0)/(phase({...s,step:0})?.total||7))*100)}
function render(){tick=Date.now();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('app').innerHTML=`<header class="top"><div class="brand">sunny<span>.</span></div><div class="date">${stamp(new Date())}</div></header>${notice?`<div class="callout" role="status">${safe(notice)}</div>`:''}${tab==='now'?renderNow():tab==='today'?renderToday():tab==='history'?renderHistory():renderSettings()}`}
function renderNow(){let s=db.session,p=phase();if(!s||s.finished)return `<section class="hero"><div class="eyebrow">A day at a time</div><div class="paw">✳</div><h1>Her day,<br><span class="accent">your pace.</span></h1><p>A flexible rhythm for Sunny. Start when she wakes, then follow what actually happens.</p></section><section class="card"><div class="row"><div><div class="eyebrow">Ready when you are</div><h2 style="margin:9px 0 0">Start Sunny's day</h2></div><span class="pill">${safe(db.cfg.wake)} guide</span></div><button class="action" data-act="start">Start day →</button>${s?.finished&&db.cfg.night?`<button class="secondary" data-act="night">+ Log night potty break</button>`:``}</section><p class="footer-note">Times are guides, not alarms. Everything stays on this device until you export a backup.</p>`;
let elapsed=Math.floor((tick-nowStepTime())/60000),remainingMs=p.duration*60000-(tick-nowStepTime()),left=Math.max(0,remainingMs),overdue=p.duration&&remainingMs<=0,cycle=s.mode==='cycle'?`Cycle ${s.cycle+1} · ${p.cycleKind}`:s.mode==='wind'?'Evening': 'Night';let meals=completed('meal'),potty=completed('potty-success');let bedtimeReady=meals>=db.cfg.meals,wakeElapsed=s.wakeStart?Math.round((tick-s.wakeStart)/60000):0;let actions=p.kind==='potty'?`<div class="split"><button class="action" data-act="potty-success">Went outside ✓</button><button class="action" style="background:var(--panel2);color:var(--ink);border:1px solid var(--line)" data-act="potty-no">Not yet →</button></div>`:`<button class="action" data-act="next">${p.kind==='nap'?'Sunny woke up':p.kind==='bed'?'Finish day':p.kind==='wind'?'Ready for bed':'Done, next step'} →</button>`;
let guide=p.duration?`<div class="big-time ${overdue?'':'accent'}" id="timer">${overdue?'+':''}${String(Math.floor(Math.abs(remainingMs)/60000)).padStart(2,'0')}:${String(Math.floor((Math.abs(remainingMs)%60000)/1000)).padStart(2,'0')}</div><p>${overdue?'Past the guide - move on when ready.':`About ${p.duration} min · started ${time(nowStepTime())}`}</p>`:`<div class="big-time accent">${p.kind==='wake'?'GO':p.kind==='bed'?'ZZZ':'NOW'}</div><p>${safe(p.detail)}</p>`;
return `<div class="row"><span class="tag"><i class="dot"></i>${safe(cycle)}</span><span class="date">${time(tick)}</span></div><section class="hero"><div class="eyebrow">What now · ${safe(p.kind==='nap'?'Rest time':'Sunny is awake')}</div><h1>${safe(p.name)}</h1>${guide}${p.duration?`<p style="margin-top:14px">${safe(p.detail)}</p>`:''}</section><div class="progress"><i style="width:${progress()}%"></i></div><section class="card"><div class="row"><div class="eyebrow">One step at a time</div><span class="pill">${safe(p.kind==='nap'?'Rest':'Wake window '+db.cfg.wakeMin+'–'+db.cfg.wakeMax+'m')}</span></div>${actions}<div class="row"><button class="textbtn" data-act="accident">+ Log an accident</button><button class="textbtn" data-act="undo">Undo last</button></div>${s.cycle>=1?`<button class="secondary" data-act="wind">End early · wind-down</button>`:''}<button class="textbtn" data-act="skip">Skip this step</button></section><div class="statline"><div class="stat"><b>${potty}</b><span>Outside potty</span></div><div class="stat"><b>${meals}/${db.cfg.meals}</b><span>Meals</span></div><div class="stat"><b>${completed('nap')}</b><span>Naps</span></div></div>${s.cycle<5&&p.kind!=='nap'&&wakeElapsed>=db.cfg.wakeMax?`<p class="callout">Sunny has been awake about ${wakeElapsed} min. Her guide is ${db.cfg.wakeMin}–${db.cfg.wakeMax} min; consider winding down for a nap.</p>`:''}${db.cfg.night?'<button class="secondary" data-act="night" style="margin-top:0">+ Log night potty break</button>':''}<p class="footer-note">Guides shift as you log real times. If her needs change, follow her rather than the timer.</p>`}
function renderToday(){let d=db.session?.day||localDate(),events=db.events.filter(e=>e.day===d);return `<div class="eyebrow">The whole picture</div><h1 style="font:800 48px Manrope;letter-spacing:-.075em;margin:10px 0 0">Today.</h1><p class="muted" style="margin:5px 0 20px">${safe(new Date(d+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}))} · actual moments, not a fixed schedule</p><div class="statline"><div class="stat"><b>${events.filter(e=>e.type==='potty-success').length}</b><span>Outside potty</span></div><div class="stat"><b>${events.filter(e=>e.type==='accident').length}</b><span>Accidents</span></div><div class="stat"><b>${events.filter(e=>e.type==='meal').length}</b><span>Meals</span></div><div class="stat"><b>${events.filter(e=>e.type==='nap').length}</b><span>Naps</span></div></div><section class="section"><h2 class="section-title">Timeline</h2>${events.length?`<div class="list">${events.slice().reverse().map(entry).join('')}</div>`:'<div class="empty">No moments logged yet.<br>Start her day when she wakes.</div>'}</section>${db.session&&!db.session.finished?'<button class="secondary" data-act="accident">+ Log an accident</button>':''}<p class="footer-note">Each event is saved on this device. Export regularly in Settings.</p>`}
function entry(e){const names={'day-start':'Day started',wake:'Woke up','potty-success':'Potty outside','potty-no':'Potty trip · no result',accident:'Accident indoors',meal:e.label||'Meal',play:'Play session',training:'Training session',enrichment:'Enrichment session',cooldown:'Cool down',nap:'Nap ended',wind:'Wind-down',bed:'Bedtime','day-end':'Day finished',skip:'Skipped step','night-potty':'Night potty break'};const symbols={'potty-success':'✓','potty-no':'↗',accident:'!','meal':'◐',nap:'☾',play:'✳',training:'✳',enrichment:'✳','night-potty':'☾'};let duration=e.duration?`${e.duration} min${e.note?' · '+e.note:''}`:e.note||'';return `<article class="entry"><div class="symbol">${safe(symbols[e.type]||'·')}</div><div><b>${safe(names[e.type]||e.type)}</b>${duration?`<small>${safe(duration)}</small>`:''}</div><time>${time(e.at)}</time></article>`}
function renderHistory(){let groups={};for(let e of db.events){(groups[e.day]??=[]).push(e)}let days=Object.keys(groups).sort().reverse();return `<div class="eyebrow">Little moments add up</div><h1 style="font:800 48px Manrope;letter-spacing:-.075em;margin:10px 0">History.</h1><p class="muted">Sunny's days, saved here on this device.</p>${days.length?days.map(d=>`<section class="historyday"><div class="dayhead"><b>${safe(new Date(d+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}))}</b><small>${groups[d].filter(e=>e.type==='potty-success').length} outside potty · ${groups[d].filter(e=>e.type==='meal').length} meals · ${groups[d].filter(e=>e.type==='accident').length} accidents</small></div><div class="list">${groups[d].slice().reverse().map(entry).join('')}</div></section>`).join(''):'<div class="empty">Her first day will appear here.</div>'}`}
function field(k,label,unit,hint='',type='number'){let v=db.cfg[k];return `<div class="field"><label for="${k}">${label}</label><input id="${k}" name="${k}" type="${type}" ${type==='number'?'min="1" max="240"':''} value="${safe(v)}"><span class="hint">${hint||unit}</span></div>`}
function renderSettings(){return `<div class="eyebrow">Make it hers</div><h1 style="font:800 48px Manrope;letter-spacing:-.075em;margin:10px 0">Settings.</h1><p class="muted">Set guides, then let real life lead.</p><form id="cfg"><section class="section"><h2 class="section-title">Her day</h2><div class="settings-grid">${field('wake','Wake guide','','','time')}${field('bed','Bedtime guide','','','time')}${field('meals','Meals per day','','1–5 meals')}${field('nap','Nap guide','','minutes')}</div><div class="field"><label><input name="night" type="checkbox" ${db.cfg.night?'checked':''}> Show night potty log</label><span class="hint">Manual log only; this app cannot wake you with an alarm.</span></div></section><section class="section"><h2 class="section-title">Step guides</h2><div class="settings-grid">${field('potty','Potty','','minutes')}${field('meal','Meal','','minutes')}${field('play','Play / activity','','minutes')}${field('cooldown','Cool down','','minutes')}${field('wakeMin','Wake window from','','minutes')}${field('wakeMax','Wake window to','','minutes')}</div></section><button class="action" type="submit">Save settings</button></form><section class="section"><h2 class="section-title">Your data</h2><div class="callout">This app stores data only on this device. It does not sync with FORGE or another phone. Export a backup before switching or clearing your browser.</div><button class="secondary" data-act="export">Export backup (.json)</button><label class="secondary" style="display:block;text-align:center;cursor:pointer">Import backup (.json)<input type="file" id="import" accept="application/json,.json" style="display:none"></label><p class="quiet">Import replaces this device's Sunny history and settings. It does not change FORGE.</p></section><p class="footer-note">Built for Sunny · v1. A rhythm guide, not veterinary advice.</p>`}
function next(skip=false){let s=db.session;if(!s||s.finished)return;let p=phase(),elapsed=Math.max(0,Math.round((Date.now()-s.started)/60000));if(p.kind==='bed'){log('bed');log('day-end');s.finished=true;persist();render();return}if(p.kind==='wind'){log('wind',{duration:elapsed});s.mode='bed';s.started=Date.now();persist();render();return}if(skip)log('skip',{note:p.name});else if(p.kind==='nap')log('nap',{duration:elapsed});else if(p.kind==='meal')log('meal',{label:p.name,duration:elapsed});else if(p.kind!=='potty'&&p.kind!=='wake')log(p.kind,{duration:elapsed});else if(p.kind==='wake')log('wake');if(p.kind==='wake'){s.wakeStart=Date.now()}if(p.kind==='nap'){const [bh,bm]=db.cfg.bed.split(':').map(Number),bed=new Date();bed.setHours(bh,bm,0,0);s.cycle=Math.min(5,s.cycle+1);s.step=0;s.started=Date.now();s.wakeStart=null}else{s.step++;s.started=Date.now()}persist();render()}
function handleAction(a){notice='';let s=db.session;if(a==='start'){if(s&&!s.finished)return;db.session={day:localDate(),cycle:0,step:0,mode:'cycle',started:Date.now(),wakeStart:Date.now(),finished:false};log('day-start');persist();render();return}if(a==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download=`sunny-backup-${localDate()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);notice='Backup downloaded. Keep it somewhere safe.';render();return}if(a==='accident'){log('accident');persist();notice='Accident logged. No judgment, just a useful record.';render();return}if(a==='night'){log('night-potty');persist();notice='Night potty break logged.';render();return}if(!s||s.finished)return;if(a==='undo'){let last=db.events.at(-1);if(!last||last.day!==s.day){notice='Nothing to undo.';render();return}if(last.type==='accident'||last.type==='night-potty'){db.events.pop()}else{notice='Only the last accident or night break can be undone here. Other entries stay in the log.';render();return}persist();render();return}if(a==='wind'){if(!confirm('Move to wind-down now? This will leave the current cycle.'))return;log('skip',{note:`End cycle at ${phase().name}`});s.mode='wind';s.started=Date.now();persist();render();return}if(a==='potty-success'||a==='potty-no'){let elapsed=Math.max(0,Math.round((Date.now()-s.started)/60000));log(a,{duration:elapsed});s.step++;s.started=Date.now();persist();render();return}if(a==='skip'||a==='next')next(a==='skip')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-tab]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;notice='';render();scrollTo(0,0)}else handleAction(b.dataset.act)});
document.addEventListener('submit',e=>{if(e.target.id!=='cfg')return;e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f.entries());v.night=f.has('night');db.cfg=sanitizeCfg(v);persist();notice='Settings saved. The current step keeps its actual start time.';render();scrollTo(0,0)});
document.addEventListener('change',async e=>{if(e.target.id!=='import')return;let file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('Backup is too large.');let v=JSON.parse(await file.text());if(v.version!==1||!Array.isArray(v.events)||v.events.length>50000||!v.cfg||typeof v.cfg!=='object')throw Error('This is not a Sunny v1 backup.');if(!confirm('Replace this device\'s Sunny data with the backup? Export the current data first if you need it.'))return;let old=db;db={version:1,cfg:sanitizeCfg(v.cfg),events:v.events.filter(x=>x&&typeof x.type==='string'&&Number.isFinite(x.at)&&x.at>0).slice(-30000),session:v.session&&typeof v.session==='object'&&Number.isFinite(v.session.started)&&Number.isFinite(v.session.cycle)&&Number.isFinite(v.session.step)&&v.session.cycle>=0&&v.session.step>=0&&v.session.step<20&&v.session.cycle<1000&&['cycle','wind','bed'].includes(v.session.mode)?v.session:null};if(!persist()){db=old;throw Error('Could not save the backup on this device.')}notice='Backup imported.';tab='now';render()}catch(err){notice=err.message||'Could not read backup.';render()}});
setInterval(()=>{if(tab==='now'&&db.session&&!db.session.finished)render()},15000);render();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sunny-rhythm/sw.js',{scope:'/sunny-rhythm/'}).catch(()=>{});
</script></body></html>
